version = 1

# The owner's files that cannot keep a header: data, markdown, JSON, Pkg's files, generated LaTeX.
[[annotations]]
path = [
    "**/*.md",
    "data/*.csv",
    "data/kite_polars/*.csv",
    "data/market/*.csv",
    "data/weather_sha256.toml",
    "paper/sources.csv",
    "**/Project.toml",
    "site/package.json",
    "site/package-lock.json",
    "site/tsconfig.json",
    "**/Manifest-v*.toml.default",
    "LocalPreferences.toml.default",
    "paper/sections/*_table.tex",
    "paper/sections/class_sources.tex",
    "paper/sections/fidelity.tex",
    "paper/sections/input_tables.tex",
    "paper/figure_style.tex",
    "paper/figure_ship.tex",
    "paper/ship/*.tex",
    "paper/sections/*numbers.tex",
    "paper/sections/study_runs.tex",
    "paper/study_runs.toml",
]
SPDX-FileCopyrightText = "2026 Bart van de Lint"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
    "data/fonts/texgyretermes-regular.otf",
    "data/fonts/texgyretermes-bold.otf",
    "data/fonts/texgyretermes-italic.otf",
]
precedence = "override"
SPDX-FileCopyrightText = "2006, 2009 B. Jackowski and J.M. Nowacki (on behalf of TeX users groups)"
SPDX-License-Identifier = "LPPL-1.3c+"

[[annotations]]
path = "data/fonts/texgyretermes-math.otf"
precedence = "override"
SPDX-FileCopyrightText = "2012-2014 B. Jackowski, P. Strzelczyk and P. Pianowski (on behalf of TeX users groups)"
SPDX-License-Identifier = "LPPL-1.3c+"

[[annotations]]
path = "paper/icons/*.svg"
precedence = "override"
SPDX-FileCopyrightText = "2020-2026 Paweł Kuna"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "data/kite_polars/lei_v3.csv"
precedence = "override"
SPDX-FileCopyrightText = "2024 Oriol Cayon, Jelle Poland, TU Delft"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "data/fonts/GUST-FONT-LICENSE.txt"
precedence = "override"
SPDX-FileCopyrightText = "2006 GUST, the Polish TeX Users Group"
SPDX-License-Identifier = "LPPL-1.3c+"

[[annotations]]
path = "data/market/imo_ghg4_*.csv"
precedence = "override"
SPDX-FileCopyrightText = "2020 International Maritime Organization"
SPDX-License-Identifier = "LicenseRef-IMO-All-Rights-Reserved"
