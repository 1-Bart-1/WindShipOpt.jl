<!-- The paper's soft kite seen from ahead, 100 across: its ram-air canopy with its cells and
the lighter cell intakes along its leading edge, the bridle joining in stages, the control
unit, whose foot is the origin, and the start of the tether, on a backdrop that hides
what lies behind the bridle. Each path's class names the part; the figure style gives
each part its colour and line weight. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-52 -81 104 91">
  <path class="backdrop" fill="white" d="M -37.97 -35.26 A 43 25 0 1 1 37.97 -35.26 L 2.5 -6 L -2.5 -6 Z"/>
  <path class="bridle" fill="none" stroke="currentColor" d="M -37.97 -35.26 L -28.71 -31.46 M -42.79 -49.49 L -28.71 -31.46 M -33.21 -62.88 L -16.44 -48.63 M -12.47 -70.93 L -16.44 -48.63 M -28.71 -31.46 L -13.09 -24.73 L -16.44 -48.63 M -13.09 -24.73 L -1.50 -6.00 M 37.97 -35.26 L 28.71 -31.46 M 42.79 -49.49 L 28.71 -31.46 M 33.21 -62.88 L 16.44 -48.63 M 12.47 -70.93 L 16.44 -48.63 M 28.71 -31.46 L 13.09 -24.73 L 16.44 -48.63 M 13.09 -24.73 L 1.50 -6.00"/>
  <path class="tether" fill="none" stroke="currentColor" d="M 0 0 L 0 8"/>
  <path class="canopy" d="M -44.15 -31.98 A 50 32 0 1 1 44.15 -31.98 L 37.97 -35.26 A 43 25 0 1 0 -37.97 -35.26 Z"/>
  <path class="intakes" fill="gray" d="M -40.44 -33.95 A 45.8 27.8 0 1 1 40.44 -33.95 L 37.97 -35.26 A 43 25 0 1 0 -37.97 -35.26 Z"/>
  <path class="cells" fill="none" stroke="white" d="M -42.79 -49.49 L -49.75 -50.19 M -33.21 -62.88 L -38.62 -67.32 M -12.47 -70.93 L -14.50 -77.62 M 12.47 -70.93 L 14.50 -77.62 M 33.21 -62.88 L 38.62 -67.32 M 42.79 -49.49 L 49.75 -50.19"/>
  <path class="unit" d="M -2.5 -6 L 2.5 -6 L 2.5 0 L -2.5 0 Z"/>
</svg>
