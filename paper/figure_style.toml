#
# The graphical vocabulary of every figure of the paper. The Julia figures read it
# through scripts/paper_figures.jl; the figure_style step writes it to
# paper/figure_style.tex as the TikZ styles and colours of the LaTeX figures.

[sizes] # [pt] as printed
text = 8.0 # labels, ticks, legends and panel titles
note = 7.0 # values written on the data and notes beside it
rule = 0.5 # axis lines, ticks, frames and box outlines
line = 1.0 # data lines
marker = 4.0 # data markers
force = 1.3 # shaft of an arrow that draws a force
flow = 0.6 # shaft of an arrow that links boxes or steps
dimension = 0.4 # dimension lines and leaders to a label
arrow_length = 4.0 # arrowhead length, the same on every arrow
arrow_width = 3.2 # arrowhead width
halo = 1.6 # white outline behind a label
clearance = 0.75 # least gap between a label and another label, line or arrow
step = 11.0 # diameter of the disc that numbers a step
crossing = 3.0 # width of the white gap a line cuts where it crosses another
hatch_pitch = 4.5 # distance between the stripes of a hatched fill
hatch_width = 0.9 # width of each stripe of a hatched fill

[colours] # hex RGB
kite = "0072B2"
wings = "E69F00"
rotors = "009E73"
vtol = "882255"
water = "56B4E9" # forces of the water: hull, rudder, propeller
wind = "737373" # the wind and the wind load on the ship
ship = "BFBFBF" # the hull drawn in plan or side view
accent = "D55E00" # one highlighted thing that is not a rig
guide = "999999" # dimension lines, leaders, reference lines
gain = "2166AC" # a saving in table cells
loss = "B2182B" # a loss in table cells

[fills] # hex RGB; fill of a TikZ box by the kind of model part it stands for, the style
# `<name> box`; each of its own lightness, so that they part in greyscale
ship = "C2D4E3" # models the ship: hull, propeller, engine, cargo
rig = "DCBD83" # models the rig
voyage = "D1E8D7" # comes from the routed voyages
cost = "D7A4A5" # a cost
data = "F3F3F3" # data or an input

[contrast] # least differences the figure_style step and every Julia figure keep
text = 4.5 # WCAG contrast of any text against what lies behind it
colour = 10.0 # CIEDE2000 difference of two rig colours, in normal and each colour-blind vision
rig_grey = 10.0 # lightness L* between two rig colours, as printed in greyscale
fill_grey = 5.0 # lightness L* between two box fills, as printed in greyscale
