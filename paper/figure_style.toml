# Sizes, colours and icons of every figure of the paper, read by scripts/paper_figures.jl
# and written by its figure_style step to paper/figure_style.tex for the TikZ figures.

[sizes] # [pt] as printed
text = 8.0 # labels, ticks, legends and panel titles
note = 7.0 # values written on the data and notes beside it
rule = 0.5 # axis lines, ticks, frames and box outlines
line = 1.0 # data lines
goal = 0.7 # goal lines, laws drawn through data and range bars
marker = 4.0 # data markers
outline = 0.7 # outline of a hollow marker
whisker = 3.0 # end mark of a range bar
force = 1.3 # shaft of an arrow that draws a force
flow = 0.6 # shaft of an arrow that links boxes or steps
icon = 1.0 # stroke of an icon
icon_size = 26.0 # side of the square an icon is drawn in
bridle = 0.35 # bridle lines of the drawn kite
cell = 0.3 # white line between two cells of the drawn kite
dimension = 0.4 # dimension lines and leaders to a label
arrow_length = 4.0 # arrowhead length, the same on every arrow
arrow_width = 3.2 # arrowhead width
halo = 1.6 # white outline behind a label
clearance = 0.75 # least gap between a label and another label, line or arrow
tick_gap = 2.5 # least gap between two tick labels side by side
step = 11.0 # diameter of the disc that numbers a step
crossing = 3.0 # width of the white gap a line cuts where it crosses another
seam = 0.25 # stroke round each shaded face of a drawn hull, closing the gaps between faces
hatch_pitch = 4.5 # distance between the stripes of a hatched fill
hatch_width = 0.9 # width of each stripe of a hatched fill

[colours] # hex RGB
kite = "0072B2"
wings = "E69F00"
rotors = "009E73"
vtol = "882255"
suction = "490092"
lei = "56B4E9"
water = "6CC4F0" # forces of the water: hull, rudder, propeller
wind = "555555" # the wind and the wind load on the ship
ship = "BFBFBF" # the hull drawn in plan or side view
keel = "2B2B2B" # the schematic ship below the waterline
topsides = "C0504D" # the schematic ship's side above the waterline
deck = "E6E1D6" # the schematic ship's deck and bulwark
icon = "4D4D4D" # an icon that stands for a concept
accent = "D55E00" # one highlighted thing that is not a rig
purple = "6B42A3" # a category beside the rigs, such as a ship
sand = "DDCC77" # a category beside the rigs
slate = "666666" # a category beside the rigs
guide = "999999" # dimension lines, leaders, reference lines
gain = "2166AC" # a saving in table cells
loss = "B2182B" # a loss in table cells

[fills] # hex RGB; fill of a TikZ box by the kind of model part it stands for, the style
# `<name> box`; each told apart from the others in colour-blind vision
ship = "BCCEDD" # models the ship: hull, propeller, engine, cargo
rig = "FFDEA3" # models the rig
voyage = "80C8A8" # comes from the routed voyages
cost = "E8B4B5" # a cost
data = "EEEEEE" # data or an input

[contrast] # least differences the figure_style step and every Julia figure keep
text = 4.5 # WCAG contrast of any text against what lies behind it
colour = 10.0 # CIEDE2000 difference of two colours meant to be told apart, in normal and
# colour-blind vision

[icons] # the Tabler icon, paper/icons/<name>.svg, that stands for each concept, the TikZ
# picture `<concept> icon`
fuel = "gas-station"
time = "clock"
port = "anchor"
cargo = "packages"
"cargo work" = "package-export"
capital = "coins"
crew = "users"
maintenance = "tool"
interest = "percentage"
"round trip" = "arrows-exchange"
cost = "receipt"
inputs = "files"
table = "table"
weather = "wind"
