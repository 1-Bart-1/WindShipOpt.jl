  high: 30.0
  unit: USD/m^2
  reason: "Engineering estimate of the manufacturing cost of the three steering actuators, which grow with kite area: 3 x 5 kUSD at 1,000 m^2."
kite_integration_fraction:
  value: 0.15
  low: 0.15
  high: 0.25
  unit: "-"
  reason: "Installation over hardware price: 15 % on a newbuild, 25 % as a retrofit (EMSA 2023, Table 7)."
kite_mass_per_area:
