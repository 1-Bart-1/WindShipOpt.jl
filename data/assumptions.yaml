newbuild_price_exponent:
  value: 0.40
  low: 0.22
  high: 0.46
  unit: "-"
  reason: "Exponent of price over deadweight from the same fit; 0.46 between 3,800 and 33,000 dwt, 0.22 between 33,000 and 82,000 dwt. Country of build differs between the small and large ships."
mechanical_propulsion_cost:
  value: 500.0
  low: 350.0
  high: 700.0
  unit: USD/kW
  reason: "Engineering estimate: a medium-speed engine package sells for ~EUR 300-350/kW (anecdotal, boatdesign.net) plus gearbox, shaft and propeller; no study-grade source found."
electric_propulsion_cost:
  value: 900.0
  low: 750.0
  high: 1300.0
  unit: USD/kW
  reason: "Diesel-electric gensets EUR 350/kW and motor EUR 120/kW (EU fact sheet Diesel-Electric Propulsion, 2019) plus converter, and a methanol premium of ~EUR 210/kW for engine and fuel system (FCBI for the Methanol Institute, via Sustainable Ships 2023)."
crew_cost:
  value: 500000.0
  low: 350000.0
  high: 800000.0
  unit: USD/year
  reason: "Engineering assumption, no public source for coaster crew cost: ~1,370 USD/day fits a mixed crew of seven, while 3,000 dwt coasters earned only ~1,500-2,000 USD/day on time charter in 2024 (ISM), which implies low-cost crewing; an all-EU crew is at the high end."
crew_cost_exponent:
  value: 0.15
  low: 0.0
  high: 0.3
  unit: "-"
  reason: "Exponent of crew cost over deadweight relative to the reference coaster: Handysize opex USD 4,500/day at 34.7k dwt and Supramax USD 4,910/day at 58.6k dwt (Pacific Basin 2024 interim report) minus maintenance_fraction of their newbuild price leaves ~USD 0.71-0.74 M/year of crew cost, against the 0.5 M coaster value. Drewry puts manning at over half of opex."
maintenance_fraction:
  value: 0.03
  low: 0.02
