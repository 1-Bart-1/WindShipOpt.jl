# Every model assumption: base `value`, `low`/`high` bounds for the sensitivity sweep,
# `unit`, and the `reason` the value was chosen.

# --- environment ---
water_density:
  value: 1025.0
  low: 1020.0
  high: 1028.0
  unit: kg/m^3
  reason: "Standard sea water at 15 °C; varies little along the route."
water_viscosity:
  value: 1.19e-6
  low: 1.05e-6
  high: 1.35e-6
  unit: m^2/s
  reason: "Sea water at 15 °C (ITTC); tropical water is warmer and less viscous."
air_density:
  value: 1.225
  low: 1.18
  high: 1.25
  unit: kg/m^3
  reason: "ISA sea level; humid tropical air is a few percent lighter."
wind_shear_exponent:
  value: 0.05
  low: 0.04
  high: 0.08
  unit: "-"
  reason: "Exponent of the mean power-law wind profile over the sea from 10 m to kite height: matches the mean ERA5 model-level profiles over the study region in 2018 (1.12, 1.18 and 1.22 times the 10 m wind at 100, 270 and 540 m; own analysis of Hersbach et al. 2020). The low bound is the trade-wind belt (1.17 at 540 m), the high bound the North Atlantic north of 40 deg N and the IJmuiden lidar, which follow a logarithmic profile with 0.2 mm roughness up to 315 m (Kalverla 2020, Ch. 2; Schelbergen et al. 2020)."

# --- reference hull, geometrically scaled with length ---
reference_length:
  value: 85.0
  low: 84.0
  high: 88.0
  unit: m
  reason: "Real 3,800 dwt coasters: Damen Combi Freighter 3850 Lpp 84.97 m, Conoship CIP3800 Lpp 84.19 m; waterline length is ~2-4 % longer (MAN ES, Basic Principles of Ship Propulsion, 2018)."
reference_beam:
  value: 13.2
  low: 12.5
  high: 14.0
  unit: m
  reason: "Damen CF3850 12.5 m, Conoship CIP3800 13.2 m, Ferus Smit 4300 14.0 m (builder datasheets)."
reference_draft:
  value: 5.5
  low: 5.25
  high: 5.95
  unit: m
  reason: "Conoship CIP3800 5.25 m, Damen CF3850 5.48 m, Ferus Smit 4300 5.95 m at summer draft (builder datasheets)."
block_coefficient:
  value: 0.83
  low: 0.78
  high: 0.87
  unit: "-"
  reason: "MAN ES (2018) lists coasters at C_B 0.70-0.85; Watson-Gilfillan gives 0.79 at Fn 0.20; the dimensions and deadweight of the CF3850 and CIP3800 imply 0.85 or more. With 13.2 m beam it reproduces ~3,800 dwt."
holtrop_max_prismatic:
  value: 0.85
  low: 0.85
  high: 1.0
  unit: "-"
  reason: "Largest prismatic coefficient at which the Holtrop-Mennen formulas are evaluated: the top of the tanker and bulk carrier range 0.73-0.85 and of the range of validity 0.55-0.85 tabulated by Ortigosa et al. (2009), second-hand, since Holtrop and Mennen (1982) and the pages of Holtrop (1984) we could read state no numbers; the 1982 paper limits the method to hulls resembling its average ship and calls its high-block adjustments tentative. 1 leaves the hull uncapped."
midship_coefficient:
  value: 0.99
  low: 0.98
  high: 0.995
  unit: "-"
  reason: "Kerlen's regression gives 0.995 and Benford's 0.997 at C_B 0.83."
centre_of_buoyancy:
  value: 2.0
  low: 0.5
  high: 3.0
  unit: "% of L forward of midships"
  reason: "Full hulls carry the centre of buoyancy forward; Schneekluth's regression gives about +2.8 % at C_P 0.84."
bulb_area_ratio:
  value: 0.06
  low: 0.0
  high: 0.10
  unit: "-"
  reason: "Engineering assumption, no coaster data found; many coasters have plain bows, hence the low end of zero."
bulb_height_ratio:
  value: 0.4
  low: 0.3
  high: 0.6
  unit: "-"
  reason: "Bulb area centre above keel over draft; Holtrop advises at most 0.6."
appendage_area_ratio:
  value: 0.02
  low: 0.015
  high: 0.03
  unit: "-"
  reason: "Engineering assumption: rudder area alone is ~1.5-2 % of L*T; no coaster source found."
appendage_form_factor:
  value: 1.5
  low: 1.3
  high: 2.0
  unit: "-"
  reason: "Holtrop's value for a rudder behind the skeg (1+k2 = 1.5-2.0)."
lightship_fraction:
  value: 0.28
  low: 0.25
  high: 0.32
  unit: "-"
  reason: "Coasters carry 70-74 % of their displacement as deadweight (Barlas, coaster main-dimension study); general cargo 65-80 %."
stores_mass:
  value: 50.0
  low: 30.0
  high: 80.0
  unit: t
  reason: "Engineering assumption, no source found."
max_froude_number:
  value: 0.28
  low: 0.25
  high: 0.3
  unit: "-"
  reason: "Holtrop-Mennen is validated up to about Fn 0.30 for general cargo ships; full coasters sail at Fn 0.23-0.29 (MAN ES 2018, coasters at 13-16 kn)."
metacentric_height_ratio:
  value: 0.075
  low: 0.05
  high: 0.10
  unit: "-"
  reason: "Engineering assumption giving GM ~1 m; only minimums are published: GM >= 0.15 m (IMO IS Code), GM >= 0.3 m for wind-assisted ships (DNV WAPS rules, via MARIN report 77001-1-SEA, 2025)."
heel_limit:
  value: 8.0
  low: 5.0
  high: 12.0
  unit: deg
  reason: "ShipCLEAN reefs sails above 8 deg (Tillig & Ringsberg 2020, Ocean Eng. 211); the ITTC wind-assisted ships committee suggests 5 deg as a first reference; DNV allows 12 deg steady-wind heel (MARIN 2025)."
entrance_length_ratio:
  value: 0.22
  low: 0.15
  high: 0.30
  unit: "-"
  reason: "Length of the bow entrance over waterline length; Holtrop's run length gives 0.26 L for the reference hull and the forward centre of buoyancy makes the entrance somewhat shorter."
pitch_gyration_ratio:
  value: 0.25
  low: 0.22
  high: 0.28
  unit: "-"
  reason: "Pitch radius of gyration over length; 0.25 is the standard estimate for conventional cargo ships (ITTC)."
wave_peakedness:
  value: 3.3
  low: 1.0
  high: 5.0
  unit: "-"
  reason: "Peak enhancement factor of the JONSWAP spectrum: 3.3 is the mean of the JONSWAP measurements (Hasselmann et al. 1973); DNV-RP-C205 relates it to peak period and wave height, from 1 (Pierson-Moskowitz, fully developed sea) to 5 (steep wind sea)."
leeway_limit:
  value: 10.0
  low: 6.0
  high: 15.0
  unit: deg
  reason: "Validity limit of the linear hull side-force model; captive tests on wind-assisted hulls cover 0-10 deg and ShipCLEAN reefs at 10 deg rudder angle (Tillig & Ringsberg 2020). No operational limit found."
rudder_aspect_ratio:
  value: 1.6
  low: 1.4
  high: 3.0
  unit: "-"
  reason: "Effective aspect ratio of a rudder of geometric aspect ratio 1.5-2: CFD of a wind-powered cargo ship gives 0.93 times the geometric value, not the doubling of a mirror plane (Kramer & Steen 2022); the high bound is that doubling."
rudder_max_lift:
  value: 1.0
  low: 0.8
  high: 1.3
  unit: "-"
  reason: "Engineering assumption: highest rudder lift coefficient spent on balancing the rig; free-stream rudder sections stall near 1.2-1.4 and some lift is kept for steering in waves."
deck_mount_height:
  value: 4.0
  low: 3.0
  high: 5.0
  unit: m
  reason: "Freeboard of real coasters is 1.5-2.0 m (CF3850, Ferus 4300, CIP3800 depth minus draft) plus a hatch coaming; no coaming height found."
superstructure_height:
  value: 10.0
  low: 8.0
  high: 14.0
  unit: m
  reason: "Engineering assumption, no source found."
windage_drag_coefficient:
  value: 0.7
  low: 0.5
  high: 0.9
  unit: "-"
  reason: "Peak longitudinal wind coefficient of a cargo ship hull and deckhouse (Blendermann range 0.5-0.9)."

# --- propulsion ---
propeller_diameter_ratio:
  value: 0.5
  low: 0.45
  high: 0.65
  unit: "-"
  reason: "Damen CF3850 2.6 m on 5.48 m draft (0.47), Ferus 4300 3.2 m on 5.95 m (0.54); electric drives allow larger, slower propellers, hence the high end."
thrust_deduction_ratio:
  value: 0.6
  low: 0.5
  high: 0.75
  unit: "-"
  reason: "t = 0.6 w (MAN ES 2018, Taylor), which equals MAN's alternative t = 0.27 C_B at C_B 0.83."
propeller_viscous_efficiency:
  value: 0.8
  low: 0.72
  high: 0.85
  unit: "-"
  reason: "Engineering assumption: open-water efficiency is typically 0.55-0.70 (MAN ES 2018), which this factor reproduces on the actuator-disk efficiency; no direct source."
shaft_efficiency:
  value: 0.96
  low: 0.95
  high: 0.97
  unit: "-"
  reason: "Shaft with reduction gear 0.95-0.96 (MAN ES 2018)."
electric_chain_efficiency:
  value: 0.9
  low: 0.85
  high: 0.93
  unit: "-"
  reason: "Electrical losses of 9.4 % for a 5 MW low-voltage plant, up to 15 % below 1 MW (Wartsila, Johannesen & Heine 2021); alternator, switchboard, converter and motor."
vlsfo_engine_efficiency:
  value: 0.44
  low: 0.42
  high: 0.45
  unit: "-"
  reason: "Wartsila 20: 190 g/kWh (0.444); MAN L21/31: 189-195 g/kWh (0.43-0.45) depending on attached pumps (project guide 2024)."
methanol_engine_efficiency:
  value: 0.44
  low: 0.42
  high: 0.45
  unit: "-"
  reason: "Brake efficiency; methanol engines run at equal efficiency to diesel (Wartsila W32 Methanol launch 2022; FCBI Methanol as a Marine Fuel 2015). The alternator sits in the electric chain."
part_load_penalty:
  value: 0.2
  low: 0.1
  high: 0.3
  unit: "-"
  reason: "Fitted to the MAN L21/31 SFOC table at 25-100 % load: 0.14-0.27 depending on speed and attached pumps."
genset_count:
  value: 3
  low: 2
  high: 4
  unit: "-"
  reason: "The Damen CF3850 has three gensets; note that the smallest medium-speed methanol genset found is ~1 MW (MAN L21/31DF-M), so smaller units may not exist off the shelf."
hotel_load:
  value: 60.0
  low: 40.0
  high: 100.0
  unit: kW
  reason: "Engineering assumption, no at-sea figure found; the CF3850's harbour gensets are 111-118 kWe."
service_speed:
  value: 10.5
  low: 9.5
  high: 12.0
  unit: kn
  reason: "Conoship CIP3800 10 kn on 750 kW; the Damen CF3850's 11.8 kn is at 3 m ballast draft, so loaded speed is lower."
sea_margin:
  value: 0.15
  low: 0.10
  high: 0.3
  unit: "-"
  reason: "Typically 10-30 %, historically 15 % (MAN ES 2018)."
engine_rating_fraction:
  value: 0.9
  low: 0.75
  high: 0.9
  unit: "-"
  reason: "Engine margin historically 10 %, up to 25 % (MAN ES 2018)."
source_sea_margin:
  value: 0.15
  low: 0.10
  high: 0.25
  unit: "-"
  reason: "Sea margin inside the engine power of the class source designs, taken out to calibrate their calm-water resistance: 15 % in every MAN ES table used (bulk carriers 2022 Tables 4-6, MR tankers 2019 Table 1, container vessels 2024 Table 19) and in the Knud E. Hansen PCTC consumptions; designers choose 10-30 %, historically 15 % (MAN ES 2023)."

# --- rigid wing ---
wing_aspect_ratio:
  value: 2.0
  low: 1.5
  high: 4.0
  unit: "-"
  reason: "Installed wings span AR 1.9-3.8: WindWings 37.5 m x 20 m (BAR Technologies), Oceanbird Wing 560 40 m x 14 m, AYRO Oceanwings 363 m^2 at 37 m."
wing_endplate_factor:
  value: 1.4
  low: 1.1
  high: 2.0
  unit: "-"
  reason: "Effective over geometric aspect ratio from the deck mirror: 2.0 sealed, 1.36 at a root gap of 1 % of span, 1.21 at 5 %, 1.09 at 20 % (minimum induced drag, Trefftz plane). WindWings stand about 7.5 m and the Oceanbird wing about 6 m above deck on pedestals (BAR; Oceanbird), the low bound."
wing_max_lift_coefficient:
  value: 2.0
  low: 1.6
  high: 2.5
  unit: "-"
  reason: "3D lift ceiling of a multi-element wing sail: AR 2 wings reach 1.70-1.73 with a 30 % flap (Reche-Vilanova et al. 2021, Table 5), a single NACA0015 sail 1.08 (Xu et al. 2025, Table 4); BAR claims 2.5 times the lift of a single element for its three-element WindWing. Two-element sections reach 1.95-2.65 in 2D (Yao 2026)."
wing_profile_drag_coefficient:
  value: 0.02
  low: 0.015
  high: 0.03
  unit: "-"
  reason: "Zero-lift drag of a thick flapped section at full-scale Reynolds number; with the separation factor it reproduces section CD 0.12 at CL 1.95 (Yao 2026)."
wing_separation_drag_factor:
  value: 0.03
  low: 0.01
  high: 0.05
  unit: "-"
  reason: "Fitted so that CD = 0.02 + 0.03 CL^2 matches the 2D two-element section CD of 0.12 at CL 1.95 and 0.24 at CL 2.65 (Yao 2026)."
wing_stalled_drag_coefficient:
  value: 1.2
  low: 1.0
  high: 1.4
  unit: "-"
  reason: "Normal-force coefficient of a stalled low-aspect-ratio wing across the flow, which a wing sail turned square to the wind gives downwind; engineering estimate from flat plates of aspect ratio 2-5, about 1.2."
wing_span_efficiency:
  value: 0.9
  low: 0.8
  high: 0.95
  unit: "-"
  reason: "Generic Oswald factor of a tapered wing; no wingsail-specific source found."
wing_interference_amplitude:
  value: 0.30
  low: 0.15
  high: 0.72
  unit: "-"
  reason: "Loss amplitude of the wing array factor: 0.44 fits sails held at one angle of attack in 3D RANS (Malmek et al. 2024) and IDDES (Xu et al. 2025); independent sheeting recovers 0-80 % of the loss depending on wind angle (van Reen 2026), a third taken here."
wing_interference_decay:
  value: 2.86
  low: 2.0
  high: 4.0
  unit: chord lengths
  reason: "Engineering estimate of the decay length of the wing array loss: no 3D data beyond 1.9 chords; set so that the loss of four wings is below 1 % at 10 chords, the widest spacing in the 2D RANS of Wang et al. (2024)."
wing_max_height:
  value: 40.0
  low: 35.0
  high: 45.0
  unit: m
  reason: "Height of the largest wing sails built: the Oceanbird Wing 560 on the Tirranna is 40 m tall and 14 m wide (Alfa Laval 2026); the WindWings on the Pyxis Ocean are 37.5 m (gCaptain 2023)."
wing_spacing:
  value: 1.5
  low: 1.2
  high: 2.0
  unit: chord lengths
  reason: "Closest spacing of wings over their chord at which wings turning about a quarter-chord pivot clear each other, also the closest spacing at which 2D RANS of three wings in line found no further gain (Wang et al. 2024)."
deck_length_fraction:
  value: 0.75
  low: 0.65
  high: 0.8
  unit: "-"
  reason: "Engineering assumption: share of the ship's length between forecastle and deckhouse that a row of rigs can use; an MR tanker has 140 m of upper deck on 182 m (Han et al. 2025), a CFD layout of five wing sails on a Kamsarmax spans 165 of 222 m (Mboumba 2022)."
max_air_draft:
  value: 45.0
  low: 35.0
  high: 60.0
  unit: m
  reason: "Highest point of a deployed deck rig above the waterline; tilting or folding rigs pass under lower bridges. Panama new locks allow 57.9 m, the Kiel Canal ~40 m."
wing_mass_per_area:
  value: 0.25
  low: 0.12
  high: 0.36
  unit: t/m^2
  reason: "Wing with pedestal and foundation: WindWing about 200 t for 750 m^2 (DNV via Riviera 2024), Oceanbird Wing 560 about 200 t with foundation (Oceanbird); smaller hard sails 0.10-0.16 (EMSA 2023, Table 4; AYRO OW RE 45 t for 363 m^2)."
wing_unit_cost:
  value: 66000.0
  low: 27000.0
  high: 153000.0
  unit: USD
  reason: "Engineering estimate of the manufacturing cost of a wing sail's controls, hydraulic power pack and 600 h of assembly; tilting or retraction is in the retractable rig premium."
wing_cost_per_area:
  value: 665.0
  low: 310.0
  high: 1760.0
  unit: USD/m^2
  reason: "Manufacturing cost per m^2 of sail from 0.13 t/m^2 (EMSA 2023, Table 4; OceanWings; Oceanbird) of tubular and stiffened steel, composite and slewing parts at NREL and WISDEM costs."
wing_installation_fraction:
  value: 0.15
  low: 0.10
  high: 0.25
  unit: "-"
  reason: "Installation over unit price: 15 % on a newbuild, 25 % as a retrofit (EMSA 2023, Table 7)."
wing_lifetime:
  value: 25.0
  low: 20.0
  high: 30.0
  unit: years
  reason: "Oceanbird designs the Wing 560 for 25 years and BAR's builder claims 25 years; EMSA (2023) takes more than 20 years for wind-propulsion assets."
rotor_aspect_ratio:
  value: 6.0
  low: 5.0
  high: 7.0
  unit: "-"
  reason: "Height over diameter of the rotor the ShipCLEAN coefficients hold for (Tillig & Ringsberg 2020); Norsepower builds 24x4, 30x5 and 35x5 m, Eco Flettner 18x3 m."
rotor_max_wind:
  value: 20.0
  low: 15.0
  high: 25.0
  unit: m/s
  reason: "Apparent wind above which the rotors stop spinning and only their drag remains (Tillig & Ringsberg 2020, Table 3)."
rotor_max_height:
  value: 35.0
  low: 30.0
  high: 40.0
  unit: m
  reason: "Height of the largest rotors built: 35x5 m tilting Norsepower rotors for the SC Connector (Marine Log 2020) and five 35x5 m Anemoi rotors on the Sohar Max (gCaptain)."
rotor_spacing:
  value: 3.0
  low: 2.5
  high: 5.0
  unit: diameters
  reason: "Closest spacing of rotors over their diameter, the closest of the three tested in the wind tunnel (3, 7.5 and 15 diameters, Bordogna et al. 2020); end discs are two diameters wide."
rotor_max_surface_speed:
  value: 47.0
  low: 40.0
  high: 50.0
  unit: m/s
  reason: "Norsepower 30x5 m at 180 rpm (EMSA 2023); Eco Flettner 18x3 m at 280 rpm gives 44 m/s."
rotor_lift_factor:
  value: 1.0
  low: 0.89
  high: 1.0
  unit: "-"
  reason: "Factor on the lift of the ShipCLEAN rotor fit, CL 9.5 at spin ratio 3 corrected with full-scale measurements (Tillig & Ringsberg 2020); CFD gives 8.5 (Li et al. 2012), the low bound."
rotor_interference_amplitude:
  value: 0.38
  low: 0.0
  high: 0.65
  unit: "-"
  reason: "Loss amplitude of the rotor array factor 1 - (1 - 1/n) A exp(-s/s0), averaged over apparent wind angles of a reaching ship: a pair 3 diameters apart loses 4-8 % in the wind tunnel at spin ratio 2 (Bordogna et al. 2020, Figs. 17-18), two to four rotors 9 diameters apart ~1 % (Han et al. 2025). The high bound is the fit with a free decay length."
rotor_interference_decay:
  value: 2.72
  low: 1.8
  high: 3.5
  unit: diameters
  reason: "Decay length of the rotor array loss, fitted to the wind-angle worst case of the Bordogna et al. (2020) pair at 3, 7.5 and 15 diameters; the low bound is the free fit with both parameters."
market_price_factor:
  value: 2.0
  low: 1.6
  high: 2.5
  unit: "-"
  reason: "Market price over manufacturing cost for wings, rotors and kites alike: production overhead of 1.37 times direct cost (NREL blade cost model) over one minus a gross margin of 30 %, between Vestas (13 %) and European machinery (45 %, Damodaran 2026)."
rotor_unit_cost:
  value: 74000.0
  low: 36000.0
  high: 165000.0
  unit: USD
  reason: "Manufacturing cost of one rotor's fixed parts: least-squares line through bottom-up costs of Norsepower 2025 rotors at NREL composite and WISDEM steel costs; times the market price factor it reproduces Norsepower's 2019 prices to within -13 % to +6 %."
rotor_cost_per_area:
  value: 2040.0
  low: 1260.0
  high: 4270.0
  unit: USD/m^2
  reason: "Manufacturing cost per m^2 of height times diameter, the slope of the same line."
rotor_installation_fraction:
  value: 0.15
  low: 0.10
  high: 0.25
  unit: "-"
  reason: "Installation over unit price, the foundation being in the unit price: 15 % on a newbuild, 25 % as a retrofit (EMSA 2023, Table 7)."
rotor_lifetime:
  value: 25.0
  low: 20.0
  high: 30.0
  unit: years
  reason: "Anemoi states a 25-year design life; EMSA (2023) takes more than 20 years for wind-propulsion assets."
retractable_rig_premium:
  value: 0.12
  low: 0.08
  high: 0.20
  unit: "-"
  reason: "Extra price of tilting, folding or rails that lower wings and rotors for cargo handling and bridges, over the fixed rig price: bottom-up estimate of the hydraulics, hinge and foundation steel (10-17 % for a tilting 35 x 5 m rotor of 56 t); such systems are in service (Norsepower tilting, Anemoi rails and folding, WindWings folding) but unpriced."
ballast_draft_fraction:
  value: 0.55
  low: 0.45
  high: 0.65
  unit: "-"
  reason: "Draft in ballast over design draft, at which bulk carriers and tankers arrive at loading berths and their air draft is highest; engineering estimate."
restricted_call_days:
  value: 2.0
  low: 1.0
  high: 3.0
  unit: days
  reason: "Time lost per port call barred by air draft, in waiting for tide or river stage (0.5-1 day) or repositioning to another cargo (1-3 days); engineering estimate, no published figure."
container_row_pitch:
  value: 2.5
  low: 2.45
  high: 2.55
  unit: m
  reason: "Width of one container row across the deck: a Panamax of 32.3 m beam carries 13 rows, an APL post-Panamax of 39.4 m beam 16."
deck_rig_clearance:
  value: 1.0
  low: 0.5
  high: 2.0
  unit: m
  reason: "Engineering estimate of the clear width a deck rig needs beside its footprint for lashing and access, added before counting the container rows it blocks."
launch_mast_width:
  value: 1.0
  low: 0.6
  high: 2.5
  unit: m
  reason: "Engineering estimate of the deck footprint of the kite's static launch mast with its foundation, a tube of ~0.8 m diameter."
wing_pedestal_width:
  value: 2.5
  low: 2.0
  high: 14.0
  unit: m
  reason: "Engineering estimate of the deck footprint of a wing raised on a pedestal above the container stacks; the high bound is a 14 m chord wing rooted at hatch level."
rotor_mass_per_area:
  value: 0.63
  low: 0.3
  high: 0.7
  unit: t/m^2
  reason: "Eco Flettner 18x3 m weighs 34 t with a typical foundation (Interreg WASP, Annika Braren); a Norsepower 30x5 m is ~42 t without foundation (EMSA 2023)."

# --- rigid VTOL kite ---
rigid_unit_area:
  value: 54.0
  low: 30.0
  high: 100.0
  unit: m^2
  reason: "Wing area of one kite: the MX2 design of Makani (Echeverri et al. 2020, Part I, Table 2) and the bottom of the price per thrust of the scaling study (data/rigid_kite_notes.md)."
rigid_aspect_ratio:
  value: 12.5
  low: 12.5
  high: 12.5
  unit: "-"
  reason: "MX2 design: 26 m span on 54 m^2 (Echeverri et al. 2020, Part I, Table 2)."
rigid_reference_mass:
  value: 1852.0
  low: 1852.0
  high: 2600.0
  unit: kg
  reason: "Mass of the MX2 design with its rotors, without tether (Echeverri et al. 2020, Part I, Table 2). The high bound adds the 40 % overrun that M600 showed over its mid-design targets (Part I, p.265)."
rigid_reference_area:
  value: 54.0
  low: 54.0
  high: 54.0
  unit: m^2
  reason: "Wing area of the MX2 design that the mass law is anchored on."
rigid_mass_exponent:
  value: 2.75
  low: 2.2
  high: 3.3
  unit: "-"
  reason: "Exponent of mass on span at fixed aspect ratio. From Wing 7, the 60 kg wing of 8 m and 3.96 m^2 that flew (Vander Lind 2013, Fig. 28.7), to the MX2 anchor it is 2.63 by area and 2.91 by span, which differ by the aspect ratios of 16 and 12.5, and 2.75 lies between; to the built M600 it is 2.87-3.18 (data/rigid_kite_notes.md). Designs without rotors give less: about 2.57 for Eijkelhof et al. (2020) and 2.2-2.6 published, the low bound. Sommerfeld et al. (2022) sweep up to 3.3 as an assumption, the high bound. Few wings and none large, so this is an estimate and not a fit."

rigid_max_force_per_area:
  value: 5.56
  low: 4.6
