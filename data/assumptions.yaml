tether_drag_coefficient:
  value: 1.1
  low: 1.0
  high: 1.2
  unit: "-"
  source: "@vandervlugt2019 [Table 1]: cylinder at tether Reynolds numbers"
  reason: "Cylinder CD 1.1 at tether Reynolds numbers 2.7e3-8.2e3 [@vandervlugt2019, Table 1]."
tether_stress:
  value: 400000000.0
  low: 300000000.0
  high: 480000000.0
  unit: Pa
  source: "@bosman2013 [Table 33.4]: HMPE rope at design factor 3"
  reason: "Working stress on the nominal diameter of the rope at design factor 3: 12-strand HMPE, 880 kN mean breaking load at 30.6 mm nominal, 399 MPa [@bosman2013, Table 33.4], the starting factor @bosman2013 and @fechner2013 advise. Our arithmetic on the wing loading, total wing area and 12 mm tether of @faggiani2018 also gives ~0.40 GPa. The low bound is design factor 4, the high bound 40 % of break load, above which the rope deteriorates rapidly in bending [@bosman2013]."
tether_length_ratio:
  value: 13.0
  low: 13.0
  high: 19.7
  unit: "-"
  source: "@erhard2013 [Fig. 18]; @paulig2013: tethers SkySails flew"
  reason: "Tether length over projected span, held during flight and changed only at launch and landing [@erhard2013]. SkySails states a flat size for its 225 m^2 kite [@paulig2013], and its 160 and 320 m^2 kites are read the same way; at 160 m^2 total to 125 m^2 projected [@folkersma2020] they flew 300 m on 125 m^2 [@erhard2013, Fig. 18] and about 360 m on 250 m^2 [@paulig2013]. At the same projected area the aspect-ratio-3 span gives 15.5 and 13.1 spans; the base follows the larger kite. The high bound is the 19.7 spans of the 125 m^2 kite's own 15.2 m span."
kite_min_elevation:
  value: 8.0
  unit: deg
  estimate: true
  source: "Authors' estimate: clear of the waves and the superstructure"
  reason: "Authors' estimate: lowest tether elevation of a pattern, keeping the kite clear of the waves and the ship's superstructure."
kite_min_turn_radius:
  value: 2.3
  low: 1.5
  high: 4.3
  unit: "-"
  source: "@erhard2013 [Eq. 7]: SkySails turn rate law"
  reason: "Smallest radius of the kite's path through the air over its projected span: the SkySails turn rate law gives a yaw rate of g times airspeed times the steering deflection delta, so a turn radius 1/(g delta), with g = 0.03-0.05 rad/m for the kite of 160 m^2 flat, 125 m^2 projected, and curve deflections delta of 40-70 % of the steering range [@erhard2013, Eq. 7, Section VIII]; 1/(0.04 x 0.55) = 45 m, with bounds 29 m and 83 m, over the 19.4 m span of that area at aspect ratio 3."
kite_stall_margin:
  value: 2.0
  unit: deg
  estimate: true
  source: "Authors' estimate: bridle trim margin for gusts"
  reason: "Authors' estimate: margin below the angle of maximum lift that the bridle trim keeps in gusts."
canopy_cloth_weight:
  value: 100.0
  unit: g/m^2
  source: "@paulig2013 [p. 561]: the cloth SkySails flew at its design load"
  reason: "What SkySails flew: the polyester ripstop of its 160 kN ship kite, fabric of slightly above 100 g/m^2 at the reference force limit, its design load [@paulig2013, p. 561], on its cells of canopy_cell_width. The cloth grows in proportion to the force limit, so it carries the same tension per weight and keeps the canopy life, as woven polyester sails of any weight, each sized to its load, are given one life [@flynn2015]. Kite and paraglider cloth weighs 27-55 g/m^2 (Porcher 2006), woven Dacron sailcloth 130-400 g/m^2."
canopy_cloth_reference_force:
  value: 0.9
  unit: kN/m^2
  source: "Set to the base force limit per area"
  reason: "Force limit at which canopy_cloth_weight and canopy_mass_overhead are stated: the design load per projected m^2 of the SkySails kite whose cloth canopy_cloth_weight is, the base kite_max_force_per_area."
canopy_cloth_specific_strength:
  value: 170.0
  unit: N/m per g/m^2
  source: "Published canopy and sail cloth strengths"
  reason: "Strength of new canopy cloth per unit cloth weight, for the cloth tension check, within the 110-210 of canopy and sail cloth data (Porcher 2006, Ambroziak and Klosowski 2018)."
canopy_skin_radius:
  value: 0.41
  unit: m
  source: "Cell equilibrium on the SkySails kite [@wang2018]"
  reason: "Radius the canopy skin bulges to between ribs, which sets its tension as pressure times radius in the cloth tension check: 0.41 m from the cell equilibrium of Wang and He 2018 on the SkySails kite, whose cells of canopy_cell_width every kite keeps."
canopy_life:
  value: 3000.0
  low: 1500.0
  high: 4000.0
  unit: flight hours
  today: 1500.0
  source: "Development goal; @flynn2015: well-kept sails at sea"
  reason: "Development goal for the flight hours of a canopy of polyester cloth, the life of a woven polyester sail at sea: a well-treated sail that is maintained regularly lasts 3,500-4,000 h [@flynn2015], and charter fleets retire their sails after 1,500-2,500 h [@northsails_durability]. The goal lies below the well-treated sail, since a kite has not shown it; the bounds run from the charter sail's shortest life to the well-treated sail's longest. The kite's extra flogging at launch and landing is charged per launch. Today: no ship kite's canopy life is published, so the estimate is the low bound, the charter sail's shortest life; small sport kites are expected to last 100 to 1,000 h."
canopy_flat_area_ratio:
  value: 1.17
  low: 1.17
  high: 1.28
  unit: "-"
  source: "@ozone_ultralite4; @advance_alpha8: built paragliders"
  reason: "Flat area of a ram-air kite over its projected area, arched in flight: 1.14-1.18 on the paragliders whose cloth the canopy inputs are stated per flat m^2 [@ozone_ultralite4; @advance_alpha8; @nova_mentor2], up to 1.28 for the one ship kite with both published, 160 m^2 flat on 125 m^2 projected [@folkersma2020]."
canopy_skin_cloth_ratio:
