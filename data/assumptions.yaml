tether_lifetime:
  value: 16000.0
  low: 4700.0
  high: 45000.0
  unit: flight hours
  reason: "Flight hours of a 12-strand SK78 tether flown at a fixed length, set by creep and its load peaks [@bosman2013; @humeau2018]. Creep damage summed by Miner's rule over the hours flown at each tension on the routed trips of the 140 m, Kamsarmax and Neo-Panamax ships at 25 °C: 10,000-12,100 h with the power law of @humeau2018 (exponent 4.43, 112 kJ/mol) anchored at 8 years at 20 % of break load and 20 °C [@dsm_sk78_mooring], 22,700-26,100 h with the time-tension-temperature diagram of @bosman2013; the base is their geometric mean, 15,100-17,800 h. Low: the power law at 30 °C with the harshest loads, 4,700-5,500 h; high: the diagram at 20 °C, 39,000-45,000 h. The swing of each figure eight, gusts and the ship's motion in a seaway shorten the creep life by 0-9 % against a steady load at its mean. Bending over the drum and sheaves at launch and landing is charged per launch from the tether bend life. Bending on the tow point disk [@skysails_patent_US11578697] wears only the 0.54 m of rope that rolls on and off it as the kite swings in elevation, in about 180 h on the 71 mm tether of the 3,200 m^2 kite; reeling in that much every 90 to 180 flight hours, at every one to five launches, moves fresh rope there and uses 50 to 100 m of spare rope over this life, 4 to 8 % of the tether, which is left out. Nearest service record: HMPE ship mooring lines, designed for 8,000 mooring hours to 75 % strength at up to 22 % of break load and retired by wear [@wilhelmsen2022]."
