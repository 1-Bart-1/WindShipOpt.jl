  reason: "Maximum tether force per projected m^2, what SkySails flew: its ship kite's design load of 160 kN on a flat area of 225 m^2 [@paulig2013, p. 561], 176 m^2 projected at the 1.28 flat over projected of a SkySails kite [@folkersma2020, Table 1]. Its 320 kN kite, 400 m^2 flat [@paulig2013, p. 554; @skysails2018], carries 1.0. The high bound reads SkySails' wing loads of up to 1 kN/m^2 [@skypower100_tib, sec. I.4] on the flat area; the low bound is the pumping kites designed for 0.45 [@faggiani2018, Table 16.1] and 0.43-0.57 kN/m^2 [@kitepower2024]. Cloth, seams and reinforcements follow the limit, so the canopy keeps its life and the bounds carry its mass and price."
