  reason: "Exponent k of the suction sail's mass on its height beyond the tallest built, mass per m^2 growing as height^(k-2): geometric similarity at equal stress gives 3; one maker's 18 m and 35 m VentoFoils, 7 t and 58 t [@econowind2026vf3; @econowind2026vf5], give 3.2, the high bound; low: the advanced wind-turbine blade, 2.53 [@fingersh2006]."
suction_mass_per_area:
  value: 0.30
  low: 0.30
  high: 0.60
  unit: t/m^2
  source: "@conoship2022econowind: eConowind unit in its container"
