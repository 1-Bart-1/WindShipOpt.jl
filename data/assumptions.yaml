  unit: "-"
  reason: "Price of the hydraulic telescopic launch mast over the steel cost of a static one: hydraulic marine cranes sell at 5.5-17 USD/kg against 1.0-1.6 USD/kg for steel monopoles, so the low bound is the cheapest crane per kg. The mast retracts because a kite aloft swings its tether round it; the SkySails ships used a telescopic mast."
docking_head_cost:
  value: 37000.0
  low: 15000.0
  high: 100000.0
  unit: USD
  reason: "Engineering estimate of the manufacturing cost of the slewing ring, gripper, hydraulics, inflation fan, controls and assembly of the docking head of a 1,000 m^2 kite."
docking_head_reference_area:
  value: 1000.0
  low: 1000.0
  high: 1000.0
  unit: m^2
  reason: "Kite area the docking head cost refers to, that of the Airseas system; the head grows with the square root of kite area, as the mast that carries it does."
docking_head_area_exponent:
  value: 0.5
  low: 0.33
  high: 1.0
  unit: "-"
  reason: "Exponent of the growth of the docking head cost with kite area: engineering estimate, as the launch mast that carries the head grows with the square root of area; the high bound is growth in proportion to canopy area."
control_unit_cost:
  value: 11000.0
  low: 6000.0
  high: 22000.0
