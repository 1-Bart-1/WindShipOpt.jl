  source: "Authors' estimate: skins round the nose and bulging between ribs"
  reason: "Cloth of the top and bottom skins per flat m^2 of a ram-air canopy: the top skin runs around the nose and the bulge between ribs, our estimate."
canopy_rib_cloth_ratio:
  value: 0.101
  unit: "-"
  estimate: true
  source: "Authors' estimate from paraglider weights [@advance_alpha8; @nova_mentor2]"
  reason: "Cloth of the ribs and diagonals per flat m^2 per unit of chord over cell width: profile ribs of 0.15 chord thickness [@dunker2013] and their diagonals make 3.0 m^2 of cloth per flat m^2 with the skins at the paragliders' 9.3 (2.6-3.7); paragliders weigh 0.18-0.24 kg per flat m^2 [@advance_alpha8; @nova_prion; @nova_mentor2], the Alpha 8 with 38-40 g/m^2 cloth."
canopy_cell_width:
  value: 0.5
  low: 0.46
  high: 0.51
  unit: m
  source: "@folkersma2020 [Table 1 and sec. 2.2]: the SkySails kite"
  reason: "Flat width of a canopy cell, which every kite keeps: that of the SkySails kite whose cloth and chord the canopy price rests on, 38 cells on 160 m^2 flat, 125 m^2 projected, 15.2 m projected span and 9.26 m largest chord [@folkersma2020, Table 1 and sec. 2.2]. Its flat span is the flat area over its mean chord, 19.5 m at the 8.2 m of canopy_structure_chord, so 0.51 m a cell, rounded to 0.5; at least the flat area over the largest chord, 17.3 m, so at least 0.46 m. The high bound takes the mean chord unchanged by the arch."
canopy_mass_overhead:
  value: 0.09
  unit: kg/m^2
  source: "Authors' fit to paragliders [@ozone_ultralite3; @nova_mentor6]"
  reason: "Canopy mass per m^2 of projected area besides its cloth, at the reference force limit and in proportion to the force limit, as they carry the load at the bridle attachments: seams, tapes, reinforcements, line attachments and the bridle lines. Paragliders of 0.12-0.24 kg/m^2 projected [@ozone_ultralite3; @ozone_ultralite4; @nova_mentor6] carry 0-20 g/m^2 per flat m^2 besides their cloth, the authors' fit of 0.05 kg/m^2 at 0.5 kN/m^2 taking their stated weights to include lines and risers."
canopy_structure_cost:
