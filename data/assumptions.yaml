  reason: "Drag on the projected area that the wind-tunnel polar of a rigid V3 model [@poland2025] lacks in flight: bridle, deformation, control unit and steering. The V3 kite flies at L/D 3.6-4.0 in traction with bridle and control unit [@vandervlugt2019], the flights kite_flight_drag is fitted to; the value gives it with its tether the ram-air kite's glide ratio of 3.9 at CL 0.8."
