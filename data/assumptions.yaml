# --- suction sail ---
suction_max_lift_coefficient:
  value: 4.9
  low: 4.8
  high: 6.0
  unit: "-"
  source: "@ghorbani2024suction [Fig. 12]: two VentiFoils measured at sea"
  reason: "Highest lift of the VentiFoil: strain gauges on two VentiFoils at sea measured a total force coefficient of 4.9 [@ghorbani2024suction, Fig. 12], the lift of its maker's one point [@wasp2023wp3, Fig. 3]. Low: full-scale CFD of one VentiFoil, 4.84 [@lagendijk2018, Table 5.1]; high: the lift coefficient of 6 a digital twin of the same ship took from the maker's data [@wasp2023wp3, p.25]."
suction_drag_coefficient:
  value: 0.84
  low: 0.81
  high: 2.4
  unit: "-"
  source: "@lagendijk2018 [Table 5.1]: full-scale CFD of one VentiFoil"
  reason: "Drag of the VentiFoil near its highest lift, from full-scale CFD of one VentiFoil, CD 0.838 at CL 4.84 [@lagendijk2018, Table 5.1], whose total force coefficient of 4.91 is what strain gauges measured at sea [@ghorbani2024suction, Fig. 12]; drag rises with the square of lift to it. Low: the same with end plates, 0.81 [@lagendijk2018, Table 5.1]; high: the maker's one point, 2.4 at lift 4.9, whose source gives it with high uncertainty [@wasp2023wp3, Fig. 3]."
suction_fan_power_per_area:
  value: 400.0
  low: 370.0
  high: 470.0
  unit: W/m^2
  source: "@smeets2024ventofoil [Fig. 3.11]: the VentoFoil maker's fan power curve"
  reason: "Full fan power of a VentoFoil per m^2 of its chord times span, drawn from the rated wind up: 0.40 kW/m^2 on its maker's curve [@smeets2024ventofoil, Eq. 3.4 and Fig. 3.11]. Low: the 11 kW ventilator of each 10 m by 3 m VentiFoil on the Frisian Sea [@ghorbani2023twin, Sec. 2.2; @werner2022frisian, Table 3]; high: two 7.5 kW ventilators on the eConowind unit's two foils of 10.3 m by 1.55 m mean chord, 32 m^2 [@conoship2022econowind]."
suction_fan_rated_wind:
  value: 14.0
  unit: m/s
  source: "@smeets2024ventofoil [Fig. 3.11]: the VentoFoil maker's fan power curve"
  reason: "Apparent wind from which a VentoFoil's fans draw their full power; below it the power falls with the cube of the apparent wind [@smeets2024ventofoil, Eq. 3.4], read off its maker's curve at 13.8 m/s [@smeets2024ventofoil, Fig. 3.11]."
suction_max_wind:
  value: 22.0
  low: 17.0
  high: 22.0
  unit: m/s
  source: "@smeets2024ventofoil [Fig. 3.11]: cut-out of the VentoFoil maker's fan curve"
  reason: "Highest apparent wind a VentoFoil works in, above which it is folded down and its fans stop: 22 m/s on its maker's curve [@smeets2024ventofoil, Sec. 3.1.11 and Fig. 3.11]. Low: the eConowind unit's foldable VentiFoils, which lie down above 17 m/s [@conoship2022econowind]."
suction_aspect_ratio:
  value: 6.6
  unit: "-"
  source: "@conoship2022econowind: VentiFoil span and chord"
