# --- rigid VTOL kite ---
rigid_reference_area:
  value: 54.0
  unit: m^2
  source: "@echeverri2020part1 [Part I, Table 2]: Makani's MX2 design"
  reason: "Wing area of the design the kite is scaled from: the MX2 design of Makani [@echeverri2020part1, Part I, Table 2], the largest wing with propellers designed in full."
rigid_aspect_ratio:
  value: 12.5
  unit: "-"
  source: "@echeverri2020part1 [Part I, Table 2]: Makani's MX2 design"
  reason: "MX2 design: 26 m span on 54 m^2 (Echeverri et al. 2020, Part I, Table 2)."
rigid_mass:
  value: 1852.0
  low: 891.0
  high: 3240.0
  unit: kg
  source: "@echeverri2020part1 [Part I, Table 2]: MX2 design without tether"
  reason: "Kite of the reference area with its propellers and drives, without its tether: 1852 kg for MX2 [@echeverri2020part1, Part I, Table 2]. Low bound, 16.5 kg/m^2: a structure at the lightest of built kites, half of 15 kg/m^2 [@aull2020, Tables 1-2] plus the spar caps, shear walls and hardpoints of Makani's build-up [@echeverri2020part2, Part II, pp.287-288], with propellers and drives at their lightest [@johnson2018, p.5] for the hover of the low bound of the hover power. High bound, 60 kg/m^2: a structure half above MX2's 1372 kg, as M600 overran its targets by 40 to 70 % [@echeverri2020part1, Part I, p.265], with heavier propellers and drives growing linearly with power."
rigid_mass_exponent:
  value: 2.5
  low: 2.2
  high: 3.1
  unit: "-"
  source: "@sommerfeld2022scaling; @vanhagen2023; @noth2008: wings built and designed"
  reason: "Power of the span to which the kite's mass grows at a fixed aspect ratio and force per area: wings built and designed show 2.2 to 3.1 [@sommerfeld2022scaling; @vanhagen2023; @noth2008], about 2.5 near MX2's size and 2.3 to 2.7 between Ampyx's AP3 and the 300 m^2 design of @vanhagen2023."
rigid_hover_power_per_mass:
  value: 470.0
  low: 200.0
  high: 950.0
  unit: W/kg
  source: "Momentum theory on MX2 [@echeverri2020part1, Part I, Eq. 89]"
  reason: "Electric power to hover a kite of MX2 with its 275 kg tether and a propeller out, per kg of kite: momentum theory for 1.25 times the weight on 6 of 8 propellers sweeping 0.61 of the wing [@echeverri2020part1, Part I, Eq. 89 and p.184], in air at sea level, with 0.71 of the shaft power reaching the air and 0.88 of the electric power reaching the shaft [@makani2020code], 0.87 MW. Low bound: the light kite of the low bound of the mass per area, with propellers over the whole wing and the propeller's 0.71 alone; high bound: 1.5 times the weight on propellers over 0.4 of the wing at an efficiency of 0.56."
rigid_max_force_per_area:
  value: 5.56
  low: 4.6
  high: 7.3
  unit: kN/m^2
  source: "@echeverri2020part1 [Part I, Table 1]: MX2 design force"
  reason: "MX2 design 250-300 kN on 54 m^2, the top of that here; M600 240 kN on 32.9 m^2 is the high bound [@echeverri2020part1, Part I, Table 1]."
rigid_max_lift:
  value: 2.0
  low: 1.8
  high: 2.2
  unit: "-"
  source: "@joshi2024powercurve [Table 1]: MX2 static lift speed"
  reason: "Highest lift coefficient of the MX2 wing, reproducing its static lift speed of 16.7 m/s [@joshi2024powercurve, Table 1]; it flies at CL 1.81 at best performance [@echeverri2020part1, Part I, Table 1]. Wing 7 is specified at CL 2 [@vanderlind2013, Fig. 28.7]."
rigid_drag:
  value: 0.07
  low: 0.054
  high: 0.127
  unit: "-"
  source: "MX2 drag less induced [@echeverri2020part1, Part I, Table 1]"
  reason: "Drag coefficient on the wing area beyond the induced drag of an elliptic wing: the CD 0.123 of the MX2 design at CL 1.81 [@echeverri2020part1, Part I, Table 1] less 0.083 induced; 0.0022 of feathered propellers, 0.0036 on their disc [@hartman1933, table p.12]; and 0.029 of the 300 m tether of 29.4 mm with its fluted jacket [@echeverri2020part1, Part I, Table 2]. Low bound: a profile drag lower by 0.01, propeller hubs at 0.0015 on the disc [@silva2018, Table 3] and a span efficiency of 0.95. High bound: M600's parasitic offset of 0.075 from a flight glide, scaled by area to 0.046 on MX2 [@makani2020code], blades a few degrees off feather and the tether as a plain cylinder."
rigid_min_turn_radius:
  value: 3.46
  low: 2.9
  high: 6.25
  unit: "-"
  source: "@echeverri2020part1: Makani's MX2 design"
  reason: "Smallest loop radius over span: 90 m on 26 m for MX2. Low bound 75 m for M600 as intended; high bound 50 m on 8 m for Wing 7 as flown [@vanderlind2013, Fig. 28.7], and M600 flew 145 m on 25.66 m, or 5.65 [@echeverri2020part1, Part I, Table 1]."
rigid_tether_length_ratio:
