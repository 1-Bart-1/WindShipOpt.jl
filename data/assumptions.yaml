tether_lifetime:
  value: 8000.0
  low: 4000.0
  high: 40000.0
  unit: flight hours
  reason: "Flight hours a Dyneema tether flies before replacement at a fixed length, bent only at the tow point; none measured. The Ampyx Power 5 MW design replaces the tether section reeled over the drum every year but the fixed section after 7 years, at 312 MPa (van Hagen et al. 2023), about 40,000 flight hours; bending fatigue over a drum gives ~4,000 h at 0.4 GPa (Joshi 2025 model). Pumping tethers last 3 months to 2 years (DEADALUS, Ampyx/DSM)."
winch_fixed_cost:
  value: 27000.0
  low: 11000.0
  high: 81000.0
  unit: USD
  reason: "Engineering estimate of the manufacturing cost of the motor, drive, sensors, controls, frame and assembly of a holding winch from component prices."
winch_cost_per_force:
  value: 0.024
  low: 0.01
  high: 0.084
  unit: USD/N
  reason: "Engineering estimate of the manufacturing cost per N of brake holding force: drum, brake and frame steel at 5 kg/kN and a gearbox for a quarter of the holding force at WISDEM gearbox cost."
launch_mast_height_ratio:
  value: 1.3
  low: 0.8
  high: 2.0
  unit: "-"
  reason: "Launch mast height over the square root of projected kite area: SkySails 15 m on 160 m^2 flat (Next Nature 2007), 125 m^2 projected, 1.34; Airseas 35 m on 1,000 m^2 of stated sail surface, 1.11 if projected and 1.25 if flat at 1.28 flat over projected; SkySails Power PN-14, on land, 19 m on 90 m^2 projected, the high bound."
launch_mast_max_height:
  value: 35.0
  low: 29.0
  high: 60.0
  unit: m
  reason: "Tallest kite launch mast at sea, the 35 m Airseas mast; larger kites are flown from a mast of this height, beyond any built launch system."
launch_mast_base_mass:
  value: 0.5
  low: 0.3
  high: 1.0
  unit: t
  reason: "Engineering estimate of the launch mast mass that does not scale with the kite: the smallest tube, platform and ladder of a mast that carries a 3 t docking head at 0.5 g."
launch_mast_mass_coefficient:
  value: 4.1e-4
  low: 2.7e-4
  high: 8.9e-4
  unit: t/m^(7/3)
  reason: "Engineering estimate of the steel mass of a telescopic launch mast, the base mass plus this coefficient times area^(2/3) times height^(5/3), for a tubular section that holds a launch pull of a tenth of the tether force; the tether runs to a deck tow point, not over the mast (Erhard & Strauch 2013)."
launch_mast_steel_cost:
  value: 2.51
  low: 1.3
  high: 5.2
  unit: USD/kg
  reason: "Manufacturing cost of fabricated tubular steel, 1.93 USD/kg (NREL WISDEM, Farkas & Jarmai), with 30 % added for the foundation."
launch_mast_telescope_factor:
  value: 2.5
