  reason: "Maximum wing loading on the projected area. 450 N/m^2 (Faggiani & Schmehl 2018); Kitepower Falcon 3.5 t on 60-80 m^2 (0.43-0.57 kN/m^2). SkySails design load on flat area: 160 kN on 225 m^2, about 0.7 kN/m^2 (Paulig et al. 2013), 0.9 on the projected area at 1.28 flat over projected (Folkersma et al. 2020). The high bound is the wing load of up to 1 kN/m^2 in SkySails' operating experience (SkyPower100 final report, Junge et al. 2023, sec. I.4)."
kite_attach_height:
  value: 10.0
  low: 6.0
  high: 15.0
  unit: m
  reason: "Engineering assumption: tether attachment on the bow mast; no source found."
tether_price:
  value: 80.0
  low: 40.0
  high: 300.0
  unit: USD/kg
  reason: "Large-diameter Dyneema SK78 rope in bulk; Faggiani & Schmehl (2018) imply ~80 EUR/kg, retail small diameters sell at 300-350 USD/kg (Marlow D12 via Mauripro/Binks)."
tether_rope_density:
  value: 600.0
  low: 550.0
  high: 650.0
  unit: kg/m^3
