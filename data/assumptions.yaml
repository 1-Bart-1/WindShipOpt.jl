newbuild_price:
  value: 1.19e7
  low: 1.0e7
  high: 2.0e7
  unit: USD
  reason: "Price of a conventional cargo ship of the reference deadweight from an Asian yard: least-squares power law through Udupi Cochin's 3,800 dwt general cargo ships (~USD 11.6 M each, Onmanorama 15 Jun 2023) and the KOBC 33k/64k/82k dwt bulker assessments of USD 31.25/35.78/38.22 M (ShipUniverse, 8 Oct 2026). A Dutch build costs more: Royal Bodewes 6,750 dwt EcoTrader ~EUR 17 M (Meriaura, Apr 2024)."
newbuild_reference_deadweight:
  value: 3800.0
  low: 3800.0
  high: 3800.0
  unit: t
