ceu_volume:
  value: 24.0
  low: 17.0
  high: 30.0
  unit: m^3
  reason: "Car-deck space per CEU that a fuel tank displaces: 8.4 m^2 of deck per CEU, our ratio of deck area to capacity for the Hoegh Target, 71,400 m^2 for 8,500 CEU [@tinsley_navigator_hoegh_target], and the Knud E. Hansen 8,600 and 6,500 CEU designs, 8.41-8.45 [@keh_8600ceu_df_pctc; @keh_future_way], times a deck pitch of 2.9 m (depth over car decks of the same designs); the low bound is the 2.0 m clear height, the high bound the enclosed volume per CEU from gross tonnage."

