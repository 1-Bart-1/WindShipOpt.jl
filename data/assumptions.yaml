# Every model assumption: base `value`, `low`/`high` bounds only where data give a range, `unit`,
# `estimate: true` where the value is the authors' own, a goal's `today`, its `source` in one
# short line, and the full `reason` the value was chosen.

# --- environment ---
water_density:
  value: 1025.0
  unit: kg/m^3
  estimate: true
  source: "Authors' estimate: sea water at 15 °C"
  reason: "Sea water at 15 °C, authors' estimate; varies little along the route."
water_viscosity:
  value: 1.19e-6
  unit: m^2/s
  estimate: true
  source: "Authors' estimate: sea water at 15 °C"
  reason: "Sea water at 15 °C, authors' estimate; tropical water is warmer and less viscous."
air_density:
  value: 1.225
  low: 1.18
  high: 1.25
  unit: kg/m^3
  source: "@vandervlugt2019: standard atmosphere at sea level"
  reason: "Sea-level density of the standard atmosphere [@vandervlugt2019]; humid tropical air is a few percent lighter."
wind_shear_exponent:
  value: 0.05
  low: 0.05
  high: 0.09
  unit: "-"
  source: "Authors' fit to ERA5 [@hersbach2020] over the study region's sea"
  reason: "Exponent of the power-law wind profile over the sea from 10 m to the mid height of the deck rigs (wing sails, suction sails and rotors), on which a kite ship's performance table is also built; the kite itself takes the ERA5 wind at its own height. ERA5 [@hersbach2020] over the sea of the study region, 2017-2019, gives on average 1.15 times the 10 m wind at 100 m, an exponent of 0.06; 0.05 in the trade-wind belt (10-25 deg N), the value, and 0.09 north of 40 deg N, which bound the range (the authors' analysis of the fields the model reads)."

# --- reference hull, geometrically scaled with length ---
reference_length:
  value: 85.0
  low: 84.0
  high: 88.0
  unit: m
  source: "@damen2025cf3850; @conoship2023cip3800: built coasters"
  reason: "Real 3,800 dwt coasters: Damen Combi Freighter 3850 Lpp 84.97 m [@damen2025cf3850], Conoship CIP3800 Lpp 84.19 m [@conoship2023cip3800]."
reference_beam:
  value: 13.2
  low: 12.5
  high: 14.0
  unit: m
  source: "@conoship2023cip3800; @damen2025cf3850: built coasters"
  reason: "Damen CF3850 12.5 m [@damen2025cf3850], Conoship CIP3800 13.2 m [@conoship2023cip3800], Ferus Smit 4300 14.0 m [@wagenborg2024ferus4300]."
reference_draft:
  value: 5.5
  low: 5.25
  high: 5.95
  unit: m
  source: "@damen2025cf3850; @conoship2023cip3800: built coasters"
  reason: "Conoship CIP3800 5.25 m at 3,800 t deadweight [@conoship2023cip3800], Damen CF3850 5.48 m design draught [@damen2025cf3850], Ferus Smit 4300 5.95 m summer draught [@wagenborg2024ferus4300]."
block_coefficient:
  value: 0.83
  unit: "-"
  source: "@man2011: coasters; fits the deadweight of built coasters"
  reason: "@man2011 lists coasters at 0.70-0.85; the dimensions and deadweight of the CF3850 [@damen2025cf3850] and CIP3800 [@conoship2023cip3800] imply 0.85 or more with a lightship weight of the authors' estimate. With 13.2 m beam it reproduces ~3,800 dwt."
holtrop_max_prismatic:
  value: 0.85
  low: 0.85
  high: 1.0
  unit: "-"
  source: "@ortigosa2009: top of the Holtrop-Mennen range of validity"
  reason: "Largest prismatic coefficient at which the Holtrop-Mennen formulas are evaluated: the top of the tanker and bulk carrier range 0.73-0.85 and of the range of validity 0.55-0.85 as tabulated by @ortigosa2009. @holtrop1982 limit the method to hulls resembling their average ship and call its high-block adjustments tentative. 1 leaves the hull uncapped."
waterline_length_ratio:
  value: 1.03
  low: 1.02
  high: 1.04
  unit: "-"
  source: "@man2011 [p. 7]: waterline over length between perpendiculars"
  reason: "Waterline length over length between perpendiculars of the class hulls and the coaster family, on which Holtrop-Mennen is evaluated: Lpp = 0.96-0.98 Lwl [@man2011, p. 7]."
midship_coefficient:
  value: 0.99
  unit: "-"
  estimate: true
  source: "Kerlen's regression [@ventura_estimation]"
  reason: "Kerlen's regression [@ventura_estimation] gives 0.995 at a block coefficient of 0.83."
centre_of_buoyancy:
  value: 2.0
  low: 0.5
  high: 3.0
  unit: "% of L forward of midships"
  source: "Schneekluth's regression [@ventura_estimation]: full hulls"
  reason: "Full hulls carry the centre of buoyancy forward; Schneekluth's regression [@ventura_estimation] gives about +2.8 % at a prismatic coefficient of 0.84."
bulb_area_ratio:
  value: 0.06
  unit: "-"
  estimate: true
  source: "Authors' estimate"
  reason: "Authors' estimate; many coasters have a plain bow, with none."
bulb_height_ratio:
  value: 0.4
  unit: "-"
  estimate: true
  source: "Authors' estimate"
  reason: "Bulb area centre above keel over draft; authors' estimate."
appendage_area_ratio:
  value: 0.02
  unit: "-"
  estimate: true
  source: "Authors' estimate: rudder area over length times draught"
  reason: "Authors' estimate; the rudder alone takes about 1.5-2 % of length times draught."
appendage_form_factor:
  value: 1.5
  low: 1.3
  high: 2.0
  unit: "-"
  source: "@holtrop1982: rudder behind skeg"
  reason: "The value of @holtrop1982 for a rudder behind the skeg (1+k2 = 1.5-2.0)."
lightship_fraction:
  value: 0.28
  unit: "-"
  estimate: true
  source: "Authors' estimate: deadweight share of coasters"
  reason: "Authors' estimate: coasters carry about 70-74 % of their displacement as deadweight, general cargo ships 65-80 %."
stores_mass:
  value: 50.0
  unit: t
  estimate: true
  source: "Authors' estimate"
  reason: "Authors' estimate."
max_froude_number:
  value: 0.28
  low: 0.25
  high: 0.3
  unit: "-"
  source: "@man2011: service speeds of full coasters"
  reason: "Full coasters sail at Fn 0.23-0.29 [@man2011, coasters at 13-16 kn], inside the Fn 0.4 up to which the resistance formulas of the model run."
metacentric_height_ratio:
  value: 0.075
  unit: "-"
  estimate: true
  source: "Authors' estimate: above the IMO and DNV minimums"
  reason: "Authors' estimate giving GM ~1 m, above the minimums of 0.15 m for cargo ships [@imo2008iscode, Part A 2.2.4] and 0.3 m for wind-assisted ships under the DNV rules [@marin2025waps, Table 3-2]."
heel_limit:
  value: 8.0
  low: 5.0
  high: 12.0
  unit: deg
  source: "@tillig2020: ShipCLEAN reefs sails above this heel"
  reason: "ShipCLEAN reefs sails above 8 deg [@tillig2020]; the ITTC committee on wind-powered ships takes 5 deg as a first reference [@ittc2024wps, sec. 4.5.5.1]; DNV allows 12 deg steady-wind heel [@marin2025waps, Table 3-2]."
entrance_length_ratio:
  value: 0.22
  low: 0.15
  high: 0.30
  unit: "-"
  source: "@holtrop1982: run length, shortened for the forward buoyancy"
  reason: "Length of the bow entrance over waterline length; the run length of @holtrop1982 gives 0.23 L for the reference hull and the forward centre of buoyancy makes the entrance somewhat shorter."
pitch_gyration_ratio:
  value: 0.25
  unit: "-"
  estimate: true
  source: "Authors' estimate: usual value for cargo ships"
  reason: "Pitch radius of gyration over length; authors' estimate, the value commonly taken for conventional cargo ships."
wave_peakedness:
  value: 3.3
  low: 1.0
  high: 5.0
  unit: "-"
  source: "@hasselmann1973: mean of the JONSWAP measurements"
  reason: "Peak enhancement factor of the JONSWAP spectrum: 3.3 is the mean of the JONSWAP measurements [@hasselmann1973]; where no site value is given, DNV-RP-C205 takes 5 for Tp/sqrt(Hs) up to 3.6 and 1, the Pierson-Moskowitz spectrum of a fully developed sea, from 5 up [@dnv2010rpc205, sec. 3.5.5]."
leeway_limit:
  value: 10.0
  low: 6.0
  high: 15.0
  unit: deg
  source: "@tillig2020: range of captive tests on wind-assisted hulls"
  reason: "Validity limit of the linear hull side-force model; captive tests on wind-assisted hulls cover 0-10 deg and ShipCLEAN reefs at 10 deg rudder angle [@tillig2020]."
hull_side_force_factor:
  value: 1.0
  low: 0.5
  high: 1.0
  unit: "-"
  source: "Kijima regression [@kim2021]; @vanderkolk2021: tank tests lower"
  reason: "Factor on the side-force slope of the Kijima regression, fitted to merchant-ship models in calm water [@kim2021]. Towing-tank tests of 138 m wind-assisted hulls without a skeg, block coefficients 0.72 and 0.83, give 0.4-0.5 times it at 6-9 deg leeway [@vanderkolk2021, Table 3]; low-aspect-ratio wing fits to the same and other hulls also lie below such regressions [@tillig2020]."
rudder_aspect_ratio:
  value: 1.6
  low: 1.4
  high: 3.0
  unit: "-"
  source: "@kramer2022: CFD of a wind-powered cargo ship"
  reason: "Effective aspect ratio of a rudder of geometric aspect ratio 1.5-2: CFD of a wind-powered cargo ship gives 0.93 times the geometric value, not the doubling of a mirror plane [@kramer2022]; the high bound is that doubling."
rudder_max_lift:
  value: 1.0
  unit: "-"
  estimate: true
  source: "Authors' estimate: below stall, keeping some for steering"
  reason: "Authors' estimate: highest rudder lift coefficient spent on balancing the rig; free-stream rudder sections stall near 1.2-1.4 and some lift is kept for steering in waves."
deck_mount_height:
  value: 4.0
  unit: m
  estimate: true
  source: "Built coasters' freeboard [@damen2025cf3850] plus coaming, estimated"
  reason: "Freeboard of real coasters, our difference of depth and draught, is 1.5-2.0 m [@damen2025cf3850; @wagenborg2024ferus4300; @conoship2023cip3800], plus a hatch coaming, the authors' estimate."
container_tier_height:
  value: 2.591
  low: 2.591
  high: 2.896
  unit: m
  source: "@hapaglloyd_container_spec [p. 4]: standard ISO container"
  reason: "Height of a standard ISO 668 container, 2.591 m; the high bound is a stack of high-cube boxes, 2.896 m [@hapaglloyd_container_spec, p. 4]."
container_stowage_fraction:
  value: 0.77
  low: 0.70
  high: 0.85
  unit: "-"
  source: "@blendermann1993: side view of a container ship"
  reason: "Length of the deck stowage over the waterline length: about 150 m on the 194.5 m container ship CON0101BN, read off its side view in @blendermann1993."

# --- propulsion ---
propeller_diameter_ratio:
  value: 0.5
  low: 0.45
  high: 0.65
  unit: "-"
  source: "@damen2025cf3850; @wagenborg2024ferus4300: built coasters"
  reason: "Damen CF3850 2.6 m on 5.48 m draft (0.47) [@damen2025cf3850], Ferus 4300 3.2 m on 5.95 m (0.54) [@wagenborg2024ferus4300]; electric drives allow larger, slower propellers, hence the high end."
thrust_deduction_ratio:
  value: 0.6
  low: 0.5
  high: 0.75
  unit: "-"
  source: "@man2011: over the wake fraction"
  reason: "Thrust deduction over wake fraction, 0.6 [@man2011], which equals MAN's alternative of 0.27 times the block coefficient at 0.83."
propeller_viscous_efficiency:
  value: 0.8
  unit: "-"
  estimate: true
  source: "Authors' estimate: reproduces open-water efficiency of @man2011"
  reason: "Authors' estimate: open-water efficiency is typically 0.55-0.70 [@man2011], which this factor reproduces on the actuator-disk efficiency."
shaft_efficiency:
  value: 0.96
  low: 0.95
  high: 0.97
  unit: "-"
  source: "@man2011: shaft with reduction gear"
  reason: "Shaft with reduction gear 0.95-0.96 [@man2011]."
direct_shaft_efficiency:
  value: 0.99
  low: 0.98
  high: 0.99
  unit: "-"
  source: "@man2011 [p. 24]: short shaft of a two-stroke"
  reason: "Short shaft of a directly coupled two-stroke engine, as on every class source design: 0.99, 0.98 for long shafts [@man2011, p. 24]."
electric_chain_efficiency:
  value: 0.9
  low: 0.85
  high: 0.93
  unit: "-"
  source: "@johannesen2021wartsila: losses of an electric plant"
  reason: "Electrical losses as low as 9.4 % for a 5 MW low-voltage plant, up to 15 % below 1 MW [@johannesen2021wartsila]; alternator, switchboard, converter and motor."
four_stroke_engine_efficiency:
  value: 0.44
  low: 0.42
  high: 0.45
  unit: "-"
  source: "@wartsila2024w20 [p. 4]: Wartsila 20, on diesel or methanol"
  reason: "Wartsila 20: 189.6 g/kWh with engine-driven pumps at a heating value of 42.7 MJ/kg [@wartsila2024w20, p. 4], 0.445 by our conversion; the bounds span the MAN L21/31 at full load, 189.1-199.9 g/kWh at 900 rpm, 900 rpm part-load optimised, 1000 rpm and variable speed, with and without engine-driven pumps [@man2024l2131, p. 137, Tables 1-4], 0.42-0.45 by our conversion. E-ammonia burns in a dual-fuel engine of the same type, and e-methanol in the four-stroke gensets of the diesel-electric drive, both taken at the same efficiency: converted engines run on methanol at equal or higher efficiency [@fcbi2015methanol, pp. 17-18; @wartsila2022w32methanol]."
two_stroke_engine_efficiency:
  value: 0.51
  low: 0.48
  high: 0.53
  unit: "-"
  source: "@faber2020 [Table 19]: fuel consumption of engines since 2001"
  reason: "Peak brake efficiency of the slow-speed two-stroke of every standard class: 165 g/kWh of marine diesel oil at 42.7 MJ/kg for engines built since 2001 [@faber2020, Table 19], 0.51 by our conversion. Low bound the same engines built 1984-2000, 175 g/kWh, 0.48; high bound the diesel-cycle dual-fuel two-stroke, 135 g/kWh of LNG at 48 MJ/kg with 6 g/kWh of pilot oil, 0.53. E-ammonia burns in a dual-fuel two-stroke of the diesel cycle, taken at the diesel's efficiency."
part_load_penalty:
  value: 0.2
  low: 0.13
  high: 0.27
  unit: "-"
  source: "Authors' fit to [@man2024l2131, p. 137]: medium-speed engine"
  reason: "Our least-squares fit of the efficiency model to the MAN L21/31 fuel consumption at 25-100 % load [@man2024l2131, p. 137, Tables 1-4] gives 0.13-0.27, depending on speed and engine-driven pumps, the range; the value is its middle."
genset_count:
  value: 3
  unit: "-"
  estimate: true
  source: "Authors' estimate; @damen2025cf3850: two gensets and emergency set"
  reason: "Authors' estimate; the Damen CF3850 has two service gensets and an emergency set [@damen2025cf3850]."
hotel_load:
  value: 60.0
  unit: kW
  estimate: true
  source: "Authors' estimate; @damen2025cf3850: service genset size"
  reason: "Authors' estimate; the CF3850's smaller service genset is 118 kWe and its shore supply 47-130 kWe [@damen2025cf3850]."
service_speed:
  value: 10.5
  low: 9.5
  high: 12.0
  unit: kn
  source: "@conoship2023cip3800; @damen2025cf3850: built coasters"
  reason: "Conoship CIP3800 10 kn with two 375 kW propulsion motors [@conoship2023cip3800]; the Damen CF3850 makes 11.8 kn at 3.20 m draught [@damen2025cf3850], far below its 5.48 m, so loaded speed is lower."
sea_margin:
  value: 0.15
  low: 0.10
  high: 0.3
  unit: "-"
  source: "@man2011: historical sea margin"
  reason: "Typically 10-30 %, historically 15 % [@man2011]."
engine_rating_fraction:
  value: 0.9
  low: 0.75
  high: 0.9
  unit: "-"
  source: "@man2011: historical engine margin"
  reason: "Engine margin historically 10 %, typically 10-30 % [@man2011]; 25 % on large bulk carriers [@man2022bulk]."
source_sea_margin:
  value: 0.15
  low: 0.10
  high: 0.25
  unit: "-"
  source: "@man2022bulk: sea margin in the MAN source designs"
  reason: "Sea margin inside the engine power of the class source designs, taken out to calibrate their calm-water resistance: 15 % in every MAN ES table used [@man2022bulk, Tables 4-6; @man2019mr, Table 1; @man2024container, Table 19] and in the PCTC consumptions of @keh_8600ceu_df_pctc; designers choose 10-30 %, historically 15 % [@man2011]."

# --- rigid wing ---
wing_aspect_ratio:
  value: 2.0
  low: 1.5
  high: 4.0
  unit: "-"
  source: "@bar2026windwings; @oceanbird2026wing560: installed wings"
  reason: "Installed wings span aspect ratios of 1.9-3: WindWings 37.5 m x 20 m [@bar2026windwings], Oceanbird Wing 560 40 m x 14 m [@oceanbird2026wing560], OceanWings 33 m x 11 m [@oceanwings2026web]."
wing_endplate_factor:
  value: 1.4
  unit: "-"
  estimate: true
  source: "Authors' calculation: induced drag with a gap at the deck"
  reason: "Effective over geometric aspect ratio from the deck mirror: 2.0 sealed, 1.36 at a root gap of 1 % of span, 1.21 at 5 %, 1.09 at 20 % (the authors' calculation of minimum induced drag in the Trefftz plane); the value takes a gap of about 1 %."
wing_max_lift_coefficient:
  value: 2.0
  low: 1.6
  high: 2.5
  unit: "-"
  source: "@yao2026: two-element section; @bar2026windwings: three-element claim"
  reason: "3D lift ceiling of a multi-element wing sail: AR 2 wings reach 1.70-1.73 with a 30 % flap [@rechevilanova2021, Table 5], a single NACA0015 sail 1.08 [@xu2025, Table 4]; BAR claims 2.5 times the lift of a single element for its three-element WindWing [@bar2026windwings]. A two-element section reaches 1.95 as first set up and 2.65 optimised, in simulations of a short span section [@yao2026, Tables 2 and 6]."
wing_profile_drag_coefficient:
  value: 0.02
  low: 0.015
  high: 0.03
  unit: "-"
  source: "Thick flapped section, checked against [@yao2026, Table 2]"
  reason: "Zero-lift drag of a thick flapped section at full-scale Reynolds number; with the separation factor it gives CD 0.134 at CL 1.95, against 0.120 for a two-element section [@yao2026, Table 2]."
wing_separation_drag_factor:
  value: 0.03
  low: 0.01
  high: 0.05
  unit: "-"
  source: "Fitted to two-element section drag [@yao2026, Tables 2 and 6]"
  reason: "Fitted so that CD = 0.02 + 0.03 CL^2 comes near the two-element section CD of 0.120 at CL 1.95 and 0.236 at CL 2.65 [@yao2026, Tables 2 and 6]; it gives 0.134 and 0.230."
wing_stalled_drag_coefficient:
  value: 1.2
  unit: "-"
  estimate: true
  source: "Authors' estimate: flat plates of aspect ratio 2-5 across the flow"
  reason: "Normal-force coefficient of a stalled low-aspect-ratio wing across the flow, which a wing sail turned square to the wind gives downwind; the authors' estimate from flat plates of aspect ratio 2-5, about 1.2."
wing_span_efficiency:
  value: 0.9
  unit: "-"
  estimate: true
  source: "Authors' estimate: tapered wing"
  reason: "Authors' estimate: the Oswald factor of a tapered wing."
wing_interference_amplitude:
  value: 0.30
  unit: "-"
  estimate: true
  source: "Authors' estimate: a third of the @malmek2024 loss, after @vanreen2026"
  reason: "Loss amplitude of the wing array factor: 0.44 fits sails held at one angle of attack in 3D RANS [@malmek2024] and IDDES [@xu2025]; independent sheeting recovers 0-80 % of the loss depending on wind angle [@vanreen2026]; the base keeps a third of it, the authors' estimate."
wing_interference_decay:
  value: 2.86
  unit: chord lengths
  estimate: true
  source: "Authors' estimate: loss under 1 % at 10 chords, as in @wang2024"
  reason: "Authors' estimate of the decay length of the wing array loss, beyond the 1.9 chords of the 3D data: set so that the loss of four wings is below 1 % at 10 chords, the widest spacing in the 2D RANS of @wang2024."
wing_reference_height:
  value: 40.0
  low: 37.5
  high: 40.0
  unit: m
  source: "@alfalaval2026oceanbird: tallest wing sail built"
  reason: "Height of the tallest wing sails built, above which the wing's size law extrapolates: the Oceanbird Wing 560 on the Tirranna is 40 m tall and 14 m wide [@alfalaval2026oceanbird]; the WindWings on the Pyxis Ocean are 37.5 m [@gcaptain2024pyxis]."
wing_mass_exponent:
  value: 3.0
  low: 2.5
  high: 3.5
  unit: "-"
  source: "Geometric similarity; @fingersh2006 [blade mass]; built wings"
  reason: "Exponent k of the wing's mass on its height beyond the tallest built, mass per m^2 growing as height^(k-2): a wing standing on deck is a cantilever under wind load, whose mass grows as size cubed at equal stress, as the built wings do, 0.12 t/m^2 for the 363 m^2 OceanWings [@oceanwings2026web] to 0.25 for the 40 m wings [@riviera2024windwing; @oceanbird2026wing560]. Low: the advanced wind-turbine blade, mass as rotor radius^2.53 [@fingersh2006]; high: the built wings with self-weight and shear."
wing_spacing:
  value: 1.5
  low: 1.2
  high: 2.0
  unit: chord lengths
  source: "Wings turning about quarter chord clear each other; @wang2024"
  reason: "Closest spacing of wings over their chord at which wings turning about a quarter-chord pivot clear each other, also the closest spacing at which 2D RANS of three wings in line found no further gain [@wang2024]."
wing_abreast_loss:
  value: 1.5
  unit: "-"
  estimate: true
  source: "@vanreen2026 [Tables 3.2-3.3]: four wings square against three in line"
  reason: "Interference loss of two wings abreast over that of two in line at the same spacing, for the two columns of the deck layout: four wings in a square lose 1.5 times what three in a line lose per wing behind another, averaged over 60, 90 and 120 degrees of apparent wind, 2.2 times at 90 degrees [@vanreen2026, Tables 3.2-3.3], with the whole loss of the square, which also holds pairs in line and on the diagonal, put on its pairs abreast."
deck_length_fraction:
  value: 0.75
  low: 0.74
  high: 0.77
  unit: "-"
  source: "@han2025; @mboumba2022: published deck layouts"
  reason: "Share of the ship's length between forecastle and deckhouse that a row or column of rigs can use: an MR tanker has 140 m of upper deck on 182 m [@han2025], a CFD layout of five wing sails on a Kamsarmax spans 165 of 222 m [@mboumba2022]; the two bound the range."
bow_mast_position:
  value: 0.06
  unit: "-"
  estimate: true
  source: "@cfr46_part42 [42.20-70]: forecastle at least 0.07 L; authors' estimate"
  reason: "Distance of a kite's launch mast on a container ship from the bow over the ship's length: on the forecastle, ahead of the first bay of containers, which the load line rules make at least 0.07 L long where it gives the bow height [@cfr46_part42, 42.20-70], behind the anchor and mooring gear at its fore end; authors' estimate, where Maersk's 35 m rotor stands on a 300 m ship [@maritimeexec2026maersk]."
blind_sector_limit:
  value: 5.0
  unit: deg
  source: "@dma2019solas [SOLAS V/22.1.2]: blind sectors"
  reason: "Widest view from the conning position that one obstruction forward of the beam may hide within 10 degrees either side of dead ahead, the SOLAS limit on navigation bridge visibility [@dma2019solas, SOLAS V/22.1.2]; the model watches every deck unit forward of the bridge that hides more with a camera system, also off to the side, where SOLAS allows 10 degrees."
camera_system_cost:
  value: 50000.0
  unit: USD
  source: "@thegpsstore2026flir: camera price; @imo2012circ1350 [para. 4]: redundancy"
  reason: "Cost of the camera system watching the view one deck unit hides from the bridge: two stabilised marine cameras with thermal and low-light channels, the redundancy IMO asks of cameras that show the ship's side from the bridge wing [@imo2012circ1350, para. 4], at 24,995 USD each [@thegpsstore2026flir]."
wing_design_wind:
  value: 20.6
  low: 17.0
  high: 20.6
  unit: m/s
  source: "@bar2026windwingscontrol: WindWings produce thrust up to 40 knots"
  reason: "Highest apparent wind a raised wing sail's support is sized for working: WindWings produce thrust up to 40 knots, 20.6 m/s, and feather above it [@bar2026windwingscontrol]. Low bound: the 17 m/s a VentiFoil works in [@conoship2022econowind]."
bay_gap:
  value: 1.5
  unit: m
  source: "@souadji2012 [Tables A.6.2-A.6.3]: two frames between 40 ft bays"
  reason: "Length along the ship of the gap between two 40 ft bays of containers, where the lashing bridges stand and a rotor pedestal can: two frames of 0.76 m in a 3100 TEU design, which takes 16 frames for each 12.19 m bay [@souadji2012, Tables A.6.2-A.6.3]."
pedestal_clearance:
  value: 2.5
  unit: m
