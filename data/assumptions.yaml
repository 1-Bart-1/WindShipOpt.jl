  reason: "Mass of the inflated tubes per projected m^2 of the V2 kite: Dacron shells and bladders of the leading edge and struts, 6.02 kg as their fabric areas times their weights per m^2, of the 11.49 kg the whole kite weighs without its control unit [@schwoll2012, Table 2-1], on 16.7 m^2 projected."
lei_tube_surface:
