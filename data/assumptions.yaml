suction_reference_height:
  value: 26.0
  unit: m
  source: "@offshoreenergy2025orchard: tallest suction sails built"
  reason: "Height of the tallest suction sails built, above which the suction sail's size law extrapolates: four 26 m eSAILs on the Atlantic Orchard [@offshoreenergy2025orchard]."
suction_mass_exponent:
  value: 3.0
  low: 2.5
  high: 3.2
  unit: "-"
