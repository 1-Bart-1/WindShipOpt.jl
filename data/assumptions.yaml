# Every model assumption: base `value`, `low`/`high` bounds for the sensitivity sweep,
# `unit`, and the `reason` the value was chosen.

# --- environment ---
water_density:
  value: 1025.0
  low: 1020.0
  high: 1028.0
  unit: kg/m^3
  reason: "Sea water at 15 °C, authors' estimate; varies little along the route."
water_viscosity:
  value: 1.19e-6
  low: 1.05e-6
  high: 1.35e-6
  unit: m^2/s
  reason: "Sea water at 15 °C, authors' estimate; tropical water is warmer and less viscous."
air_density:
  value: 1.225
  low: 1.18
  high: 1.25
  unit: kg/m^3
  reason: "Sea-level density of the standard atmosphere [@vandervlugt2019]; humid tropical air is a few percent lighter."
wind_shear_exponent:
  value: 0.05
  low: 0.04
  high: 0.08
  unit: "-"
  reason: "Exponent of the mean power-law wind profile over the sea from 10 m to kite height: matches the mean ERA5 model-level profiles [@hersbach2020] over the study region in 2018 (1.12, 1.18 and 1.22 times the 10 m wind at 100, 270 and 540 m; the authors' analysis of ERA5). The low bound is the trade-wind belt (1.17 at 540 m), the high bound the North Atlantic north of 40 deg N and the IJmuiden lidar, which follow a logarithmic profile with 0.2 mm roughness up to 315 m [@kalverla2020thesis, Ch. 2; @schelbergen2020]."

# --- reference hull, geometrically scaled with length ---
reference_length:
  value: 85.0
  low: 84.0
  high: 88.0
  unit: m
  reason: "Real 3,800 dwt coasters: Damen Combi Freighter 3850 Lpp 84.97 m [@damen2025cf3850], Conoship CIP3800 Lpp 84.19 m [@conoship2023cip3800]."
reference_beam:
  value: 13.2
  low: 12.5
  high: 14.0
  unit: m
  reason: "Damen CF3850 12.5 m [@damen2025cf3850], Conoship CIP3800 13.2 m [@conoship2023cip3800], Ferus Smit 4300 14.0 m [@wagenborg2024ferus4300]."
reference_draft:
  value: 5.5
  low: 5.25
  high: 5.95
  unit: m
  reason: "Conoship CIP3800 5.25 m at 3,800 t deadweight [@conoship2023cip3800], Damen CF3850 5.48 m design draught [@damen2025cf3850], Ferus Smit 4300 5.95 m summer draught [@wagenborg2024ferus4300]."
block_coefficient:
  value: 0.83
  low: 0.78
  high: 0.87
  unit: "-"
  reason: "@man2011 lists coasters at 0.70-0.85; the dimensions and deadweight of the CF3850 [@damen2025cf3850] and CIP3800 [@conoship2023cip3800] imply 0.85 or more with a lightship weight of the authors' estimate. With 13.2 m beam it reproduces ~3,800 dwt."
holtrop_max_prismatic:
  value: 0.85
  low: 0.85
  high: 1.0
  unit: "-"
  reason: "Largest prismatic coefficient at which the Holtrop-Mennen formulas are evaluated: the top of the tanker and bulk carrier range 0.73-0.85 and of the range of validity 0.55-0.85 as tabulated by @ortigosa2009. @holtrop1982 limit the method to hulls resembling their average ship and call its high-block adjustments tentative. 1 leaves the hull uncapped."
waterline_length_ratio:
  value: 1.03
  low: 1.02
  high: 1.04
  unit: "-"
  reason: "Waterline length over length between perpendiculars of the class hulls and the coaster family, on which Holtrop-Mennen is evaluated: Lpp = 0.96-0.98 Lwl [@man2011, p. 7]."
midship_coefficient:
  value: 0.99
  low: 0.98
  high: 0.995
  unit: "-"
  reason: "Kerlen's regression [@ventura_estimation] gives 0.995 at a block coefficient of 0.83; the bounds are the authors' estimate."
centre_of_buoyancy:
  value: 2.0
  low: 0.5
  high: 3.0
  unit: "% of L forward of midships"
  reason: "Full hulls carry the centre of buoyancy forward; Schneekluth's regression [@ventura_estimation] gives about +2.8 % at a prismatic coefficient of 0.84."
bulb_area_ratio:
  value: 0.06
  low: 0.0
  high: 0.10
  unit: "-"
  reason: "Authors' estimate; the low bound of zero is a plain bow, as many coasters have."
bulb_height_ratio:
  value: 0.4
  low: 0.3
  high: 0.6
  unit: "-"
  reason: "Bulb area centre above keel over draft; authors' estimate."
appendage_area_ratio:
  value: 0.02
  low: 0.015
  high: 0.03
  unit: "-"
  reason: "Authors' estimate; the rudder alone takes about 1.5-2 % of length times draught."
appendage_form_factor:
  value: 1.5
  low: 1.3
  high: 2.0
  unit: "-"
  reason: "The value of @holtrop1982 for a rudder behind the skeg (1+k2 = 1.5-2.0)."
lightship_fraction:
  value: 0.28
  low: 0.25
  high: 0.32
  unit: "-"
  reason: "Authors' estimate: coasters carry about 70-74 % of their displacement as deadweight, general cargo ships 65-80 %."
stores_mass:
  value: 50.0
  low: 30.0
  high: 80.0
  unit: t
  reason: "Authors' estimate."
max_froude_number:
  value: 0.28
  low: 0.25
  high: 0.3
  unit: "-"
  reason: "Full coasters sail at Fn 0.23-0.29 [@man2011, coasters at 13-16 kn], inside the Fn 0.4 up to which the resistance formulas of the model run."
metacentric_height_ratio:
  value: 0.075
  low: 0.05
  high: 0.10
  unit: "-"
  reason: "Authors' estimate giving GM ~1 m, above the minimums of 0.15 m for cargo ships [@imo2008iscode, Part A 2.2.4] and 0.3 m for wind-assisted ships under the DNV rules [@marin2025waps, Table 3-2]."
heel_limit:
  value: 8.0
  low: 5.0
  high: 12.0
  unit: deg
  reason: "ShipCLEAN reefs sails above 8 deg [@tillig2020]; the ITTC committee on wind-powered ships takes 5 deg as a first reference [@ittc2024wps, sec. 4.5.5.1]; DNV allows 12 deg steady-wind heel [@marin2025waps, Table 3-2]."
entrance_length_ratio:
  value: 0.22
  low: 0.15
  high: 0.30
  unit: "-"
  reason: "Length of the bow entrance over waterline length; the run length of @holtrop1982 gives 0.23 L for the reference hull and the forward centre of buoyancy makes the entrance somewhat shorter."
pitch_gyration_ratio:
  value: 0.25
  low: 0.22
  high: 0.28
  unit: "-"
  reason: "Pitch radius of gyration over length; authors' estimate, the value commonly taken for conventional cargo ships."
wave_peakedness:
  value: 3.3
  low: 1.0
  high: 5.0
  unit: "-"
  reason: "Peak enhancement factor of the JONSWAP spectrum: 3.3 is the mean of the JONSWAP measurements [@hasselmann1973]; where no site value is given, DNV-RP-C205 takes 5 for Tp/sqrt(Hs) up to 3.6 and 1, the Pierson-Moskowitz spectrum of a fully developed sea, from 5 up [@dnv2010rpc205, sec. 3.5.5]."
leeway_limit:
  value: 10.0
  low: 6.0
  high: 15.0
  unit: deg
  reason: "Validity limit of the linear hull side-force model; captive tests on wind-assisted hulls cover 0-10 deg and ShipCLEAN reefs at 10 deg rudder angle [@tillig2020]."
hull_side_force_factor:
  value: 1.0
  low: 0.5
  high: 1.0
  unit: "-"
  reason: "Factor on the side-force slope of the Kijima regression, fitted to merchant-ship models in calm water [@kim2021]. Towing-tank tests of 138 m wind-assisted hulls without a skeg, block coefficients 0.72 and 0.83, give 0.4-0.5 times it at 6-9 deg leeway [@vanderkolk2021, Table 3]; low-aspect-ratio wing fits to the same and other hulls also lie below such regressions [@tillig2020]."
rudder_aspect_ratio:
  value: 1.6
  low: 1.4
  high: 3.0
  unit: "-"
  reason: "Effective aspect ratio of a rudder of geometric aspect ratio 1.5-2: CFD of a wind-powered cargo ship gives 0.93 times the geometric value, not the doubling of a mirror plane [@kramer2022]; the high bound is that doubling."
rudder_max_lift:
  value: 1.0
  low: 0.8
  high: 1.3
  unit: "-"
  reason: "Authors' estimate: highest rudder lift coefficient spent on balancing the rig; free-stream rudder sections stall near 1.2-1.4 and some lift is kept for steering in waves."
deck_mount_height:
  value: 4.0
  low: 3.0
  high: 5.0
  unit: m
  reason: "Freeboard of real coasters, our difference of depth and draught, is 1.5-2.0 m [@damen2025cf3850; @wagenborg2024ferus4300; @conoship2023cip3800], plus a hatch coaming, the authors' estimate."
container_tier_height:
  value: 2.591
  low: 2.591
  high: 2.896
  unit: m
  reason: "Height of a standard ISO 668 container, 2.591 m; the high bound is a stack of high-cube boxes, 2.896 m [@hapaglloyd_container_spec, p. 4]."
container_stowage_fraction:
  value: 0.77
  low: 0.70
  high: 0.85
  unit: "-"
  reason: "Length of the deck stowage over the waterline length: about 150 m on the 194.5 m container ship CON0101BN, read off its side view in @blendermann1993."

# --- propulsion ---
propeller_diameter_ratio:
  value: 0.5
  low: 0.45
  high: 0.65
  unit: "-"
  reason: "Damen CF3850 2.6 m on 5.48 m draft (0.47) [@damen2025cf3850], Ferus 4300 3.2 m on 5.95 m (0.54) [@wagenborg2024ferus4300]; electric drives allow larger, slower propellers, hence the high end."
thrust_deduction_ratio:
  value: 0.6
  low: 0.5
  high: 0.75
  unit: "-"
  reason: "Thrust deduction over wake fraction, 0.6 [@man2011], which equals MAN's alternative of 0.27 times the block coefficient at 0.83."
propeller_viscous_efficiency:
  value: 0.8
  low: 0.72
  high: 0.85
  unit: "-"
  reason: "Authors' estimate: open-water efficiency is typically 0.55-0.70 [@man2011], which this factor reproduces on the actuator-disk efficiency."
shaft_efficiency:
  value: 0.96
  low: 0.95
  high: 0.97
  unit: "-"
  reason: "Shaft with reduction gear 0.95-0.96 [@man2011]."
direct_shaft_efficiency:
  value: 0.99
  low: 0.98
  high: 0.99
  unit: "-"
  reason: "Short shaft of a directly coupled two-stroke engine, as on every class source design: 0.99, 0.98 for long shafts [@man2011, p. 24]."
electric_chain_efficiency:
  value: 0.9
  low: 0.85
  high: 0.93
  unit: "-"
  reason: "Electrical losses as low as 9.4 % for a 5 MW low-voltage plant, up to 15 % below 1 MW [@johannesen2021wartsila]; alternator, switchboard, converter and motor."
vlsfo_engine_efficiency:
  value: 0.44
  low: 0.42
  high: 0.45
  unit: "-"
  reason: "Wartsila 20: 189.6 g/kWh with engine-driven pumps at a heating value of 42.7 MJ/kg [@wartsila2024w20, p. 4], 0.445 by our conversion; the bounds span the MAN L21/31 at full load, 189.1-199.9 g/kWh at 900 rpm, 900 rpm part-load optimised, 1000 rpm and variable speed, with and without engine-driven pumps [@man2024l2131, p. 137, Tables 1-4], 0.42-0.45 by our conversion."
methanol_engine_efficiency:
  value: 0.44
  low: 0.42
  high: 0.45
  unit: "-"
  reason: "Brake efficiency, the same as on diesel: converted engines run on methanol at equal or higher efficiency [@fcbi2015methanol, pp. 17-18; @wartsila2022w32methanol]. The alternator sits in the electric chain."
part_load_penalty:
  value: 0.2
  low: 0.1
  high: 0.3
  unit: "-"
  reason: "Our least-squares fit of the efficiency model to the MAN L21/31 fuel consumption at 25-100 % load [@man2024l2131, p. 137, Tables 1-4] gives 0.13-0.27, depending on speed and engine-driven pumps; the value is its middle, and the wider bounds are the authors' estimate."
genset_count:
  value: 3
  low: 2
  high: 4
  unit: "-"
  reason: "Authors' estimate; the Damen CF3850 has two service gensets and an emergency set [@damen2025cf3850]."
hotel_load:
  value: 60.0
  low: 40.0
  high: 100.0
  unit: kW
  reason: "Authors' estimate; the CF3850's smaller service genset is 118 kWe and its shore supply 47-130 kWe [@damen2025cf3850]."
service_speed:
  value: 10.5
  low: 9.5
  high: 12.0
  unit: kn
  reason: "Conoship CIP3800 10 kn with two 375 kW propulsion motors [@conoship2023cip3800]; the Damen CF3850 makes 11.8 kn at 3.20 m draught [@damen2025cf3850], far below its 5.48 m, so loaded speed is lower."
sea_margin:
  value: 0.15
  low: 0.10
  high: 0.3
  unit: "-"
  reason: "Typically 10-30 %, historically 15 % [@man2011]."
engine_rating_fraction:
  value: 0.9
  low: 0.75
  high: 0.9
  unit: "-"
  reason: "Engine margin historically 10 %, typically 10-30 % [@man2011]; 25 % on large bulk carriers [@man2022bulk]."
source_sea_margin:
  value: 0.15
  low: 0.10
  high: 0.25
  unit: "-"
  reason: "Sea margin inside the engine power of the class source designs, taken out to calibrate their calm-water resistance: 15 % in every MAN ES table used [@man2022bulk, Tables 4-6; @man2019mr, Table 1; @man2024container, Table 19] and in the PCTC consumptions of @keh_8600ceu_df_pctc; designers choose 10-30 %, historically 15 % [@man2011]."

# --- rigid wing ---
wing_aspect_ratio:
  value: 2.0
  low: 1.5
  high: 4.0
  unit: "-"
  reason: "Installed wings span aspect ratios of 1.9-3: WindWings 37.5 m x 20 m [@bar2026windwings], Oceanbird Wing 560 40 m x 14 m [@oceanbird2026wing560], OceanWings 33 m x 11 m [@oceanwings2026web]."
wing_endplate_factor:
  value: 1.4
  low: 1.1
  high: 2.0
  unit: "-"
  reason: "Effective over geometric aspect ratio from the deck mirror: 2.0 sealed, 1.36 at a root gap of 1 % of span, 1.21 at 5 %, 1.09 at 20 % (the authors' calculation of minimum induced drag in the Trefftz plane). The low bound is the authors' estimate for a wing on a pedestal 6-8 m above deck."
wing_max_lift_coefficient:
  value: 2.0
  low: 1.6
  high: 2.5
  unit: "-"
  reason: "3D lift ceiling of a multi-element wing sail: AR 2 wings reach 1.70-1.73 with a 30 % flap [@rechevilanova2021, Table 5], a single NACA0015 sail 1.08 [@xu2025, Table 4]; BAR claims 2.5 times the lift of a single element for its three-element WindWing [@bar2026windwings]. A two-element section reaches 1.95 as first set up and 2.65 optimised, in simulations of a short span section [@yao2026, Tables 2 and 6]."
wing_profile_drag_coefficient:
  value: 0.02
  low: 0.015
  high: 0.03
  unit: "-"
  reason: "Zero-lift drag of a thick flapped section at full-scale Reynolds number; with the separation factor it gives CD 0.134 at CL 1.95, against 0.120 for a two-element section [@yao2026, Table 2]."
wing_separation_drag_factor:
  value: 0.03
  low: 0.01
  high: 0.05
  unit: "-"
  reason: "Fitted so that CD = 0.02 + 0.03 CL^2 comes near the two-element section CD of 0.120 at CL 1.95 and 0.236 at CL 2.65 [@yao2026, Tables 2 and 6]; it gives 0.134 and 0.230."
wing_stalled_drag_coefficient:
  value: 1.2
  low: 1.0
  high: 1.4
  unit: "-"
  reason: "Normal-force coefficient of a stalled low-aspect-ratio wing across the flow, which a wing sail turned square to the wind gives downwind; the authors' estimate from flat plates of aspect ratio 2-5, about 1.2."
wing_span_efficiency:
  value: 0.9
  low: 0.8
  high: 0.95
  unit: "-"
  reason: "Authors' estimate: the Oswald factor of a tapered wing."
wing_interference_amplitude:
  value: 0.30
  low: 0.15
  high: 0.72
  unit: "-"
  reason: "Loss amplitude of the wing array factor: 0.44 fits sails held at one angle of attack in 3D RANS [@malmek2024] and IDDES [@xu2025]; independent sheeting recovers 0-80 % of the loss depending on wind angle [@vanreen2026]; the base keeps a third of it, the authors' estimate."
wing_interference_decay:
  value: 2.86
  low: 2.0
  high: 4.0
  unit: chord lengths
  reason: "Authors' estimate of the decay length of the wing array loss, beyond the 1.9 chords of the 3D data: set so that the loss of four wings is below 1 % at 10 chords, the widest spacing in the 2D RANS of @wang2024."
wing_max_height:
  value: 40.0
  low: 35.0
  high: 45.0
  unit: m
  reason: "Height of the largest wing sails built: the Oceanbird Wing 560 on the Tirranna is 40 m tall and 14 m wide [@alfalaval2026oceanbird]; the WindWings on the Pyxis Ocean are 37.5 m [@gcaptain2024pyxis]."
wing_spacing:
  value: 1.5
  low: 1.2
  high: 2.0
  unit: chord lengths
  reason: "Closest spacing of wings over their chord at which wings turning about a quarter-chord pivot clear each other, also the closest spacing at which 2D RANS of three wings in line found no further gain [@wang2024]."
deck_length_fraction:
  value: 0.75
  low: 0.65
  high: 0.8
  unit: "-"
  reason: "Authors' estimate: share of the ship's length between forecastle and deckhouse that a row of rigs can use; an MR tanker has 140 m of upper deck on 182 m [@han2025], a CFD layout of five wing sails on a Kamsarmax spans 165 of 222 m [@mboumba2022]."
max_air_draft:
  value: 45.0
  low: 35.0
  high: 60.0
  unit: m
  reason: "Highest point of a deployed deck rig above the waterline; tilting or folding rigs pass under lower bridges. Authors' estimate, between the about 40 m of the Kiel Canal and the 57.9 m of the new Panama locks."
wing_mass_per_area:
  value: 0.25
  low: 0.12
  high: 0.36
  unit: t/m^2
  reason: "Wing with pedestal and foundation: a WindWing weighs about 200 t [@riviera2024windwing] for 750 m^2 [@bar2026windwings], the Oceanbird Wing 560 with its foundation about 200 t for 40 m x 14 m [@oceanbird2026wing560]; smaller hard sails 0.10-0.16 [@emsa2023, Table 4], the OceanWings OW RE 45 t for 363 m^2 [@oceanwings2026web]."
wing_unit_cost:
  value: 66000.0
  low: 27000.0
  high: 153000.0
  unit: USD
  reason: "Authors' estimate of the manufacturing cost of a wing sail's controls, hydraulic power pack and 600 h of assembly; tilting or retraction is in the retractable rig premium."
wing_cost_per_area:
  value: 665.0
  low: 310.0
  high: 1760.0
  unit: USD/m^2
  reason: "Authors' estimate of the manufacturing cost per m^2 of sail from 0.13 t/m^2 [@emsa2023, Table 4], near the 45 t for 363 m^2 of the OceanWings OW RE [@oceanwings2026web]: steel at the authors' cost, composite at the material prices of the NREL blade cost model [@bortolotti2019blade, Tables 1-2] and slewing parts at the yaw-system cost of @wisdem_csm."
wing_installation_fraction:
  value: 0.15
  low: 0.10
  high: 0.20
  unit: "-"
  reason: "Installation at the yard over unit price. EMSA assumes 15 % on a newbuild [@emsa2023, Table 7] and gives no range; our range of 10-20 % spans the lower share EMSA expects on the largest units and on a yard's repeated designs and the higher one of a one-off design."
wing_lifetime:
  value: 25.0
  low: 20.0
  high: 30.0
  unit: years
  reason: "Oceanbird designs the Wing 560 for 25 years [@oceanbird2026wing560] and BAR states a 25-year operational life for WindWings [@bar2026windwings]; @emsa2023 takes more than 20 years for wind-propulsion assets."
rotor_aspect_ratio:
  value: 6.0
  low: 5.0
  high: 7.0
  unit: "-"
  reason: "Height over diameter of the rotor the ShipCLEAN coefficients hold for [@tillig2020]; Norsepower builds 24x4, 30x5 and 35x5 m [@norsepower2025, p. 3], Eco Flettner 18x3 m [@ecoflettner2026rotor]."
rotor_max_wind:
  value: 20.0
  low: 15.0
  high: 25.0
  unit: m/s
  reason: "Apparent wind above which the rotors stop spinning and only their drag remains [@tillig2020, Table 3]."
rotor_max_height:
  value: 35.0
  low: 30.0
  high: 40.0
  unit: m
  reason: "Height of the largest rotors built: 35x5 m tilting Norsepower rotors for the SC Connector [@marinelog2020scconnector] and five 35x5 m Anemoi rotors on the Sohar Max [@maritimeexecutive2024sohar]."
rotor_spacing:
  value: 3.0
  low: 2.5
  high: 5.0
  unit: diameters
  reason: "Closest spacing of rotors over their diameter, the closest of the three tested in the wind tunnel by @bordogna2020 (3, 7.5 and 15 diameters); end discs are two diameters wide."
rotor_max_surface_speed:
  value: 47.0
  low: 40.0
  high: 50.0
  unit: m/s
  reason: "Norsepower 30x5 m at 180 rpm [@emsa2023]; Eco Flettner 18x3 m at its maximum of 280 rpm [@ecoflettner2026rotor] gives 44 m/s."
rotor_lift_factor:
  value: 1.0
  low: 0.89
  high: 1.0
  unit: "-"
  reason: "Factor on the lift of the ShipCLEAN rotor fit, CL 9.5 at spin ratio 3 corrected with full-scale measurements [@tillig2020]; CFD gives about 8.5 at spin ratio 3 and aspect ratio 6 [@tillig2020, sec. 3.5], the low bound."
rotor_interference_amplitude:
  value: 0.38
  low: 0.0
  high: 0.65
  unit: "-"
  reason: "Loss amplitude of the rotor array factor 1 - (1 - 1/n) A exp(-s/s0), averaged over apparent wind angles of a reaching ship: a pair 3 diameters apart loses 4-8 % in the wind tunnel at spin ratio 2 [@bordogna2020, Figs. 17-18], two to four rotors 9 diameters apart ~1 % [@han2025]. The high bound is the fit with a free decay length."
rotor_interference_decay:
  value: 2.72
  low: 1.8
  high: 3.5
  unit: diameters
  reason: "Decay length of the rotor array loss, fitted to the wind-angle worst case of the @bordogna2020 pair at 3, 7.5 and 15 diameters; the low bound is the free fit with both parameters."
market_price_factor:
  value: 2.0
  low: 1.6
  high: 2.5
  unit: "-"
  reason: "Price over manufacturing cost at which a maker covers its overhead and margin, for wings, rotors and kites alike: full production cost of 1.37 times materials and direct labour, our ratio for the two glass-fibre blades of the NREL blade cost model, 1.36 and 1.38 [@bortolotti2019blade, Tables 23 and 26], over one minus a gross margin of 30 %. The bounds take margins of 13 %, the authors' estimate for a large maker, and 45 %, that of European machinery [@damodaran2026margins]."
learning_rate:
  value: 0.12
  low: 0.05
  high: 0.19
  unit: "-"
  reason: "Fall of a rig's price per doubling of the units of its kind built, the same for every rig: 12 %, the mean both of 12 studies of onshore and of 2 of offshore wind farms, the machines nearest to a rig, and the offshore range, since the onshore one runs from a rise of 11 % to a fall of 32 % [@rubin2015, Table 1]."
stage_ships:
  value: 1000.0
  low: 1000.0
  high: 1000.0
  unit: ships
  reason: "Ships fitted with a rig of a kind at the production stage every rig is priced at, the same for all three."
kites_per_ship:
  value: 1.0
  low: 1.0
  high: 1.0
  unit: "-"
  reason: "Kites a ship carries [@emsa2023, p. 45]."
rotors_per_ship:
  value: 3.0
  low: 3.0
  high: 3.0
  unit: "-"
  reason: "Rotors a ship carries, as wind propulsion units on a bulk carrier or tanker [@emsa2023, Table 5]."
wings_per_ship:
  value: 3.0
  low: 3.0
  high: 3.0
  unit: "-"
  reason: "Wing sails a ship carries, as wind propulsion units on a bulk carrier or tanker [@emsa2023, Table 5]."
hicp_today:
  value: 128.75
  low: 128.75
  high: 128.75
  unit: "-"
  reason: "Euro area consumer price index of 2025, 2015 = 100, that brings a rig price to today's money [@eurostat2026hicp]."
rotor_unit_cost:
  value: 74000.0
  low: 36000.0
  high: 165000.0
  unit: USD
  reason: "Manufacturing cost of one rotor's fixed parts: least-squares line through the authors' bottom-up costs of the Norsepower rotor sizes and masses [@norsepower2025, p. 3], composite at the material prices of the NREL blade cost model [@bortolotti2019blade, Tables 1-2] and steel at the authors' cost."
rotor_cost_per_area:
  value: 2040.0
  low: 1260.0
  high: 4270.0
  unit: USD/m^2
