  high: 1.40
  unit: "-"
  reason: "Moulded depth over draft: coasters have 1.5-2.0 m freeboard on 5.25-5.95 m draft (CF3850, Ferus 4300, CIP3800), so 1.27-1.36."
loading_port_dues:
