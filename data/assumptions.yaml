  reason: "Engineering assumption: a SkySails set-up of 160 m^2 flat, 125 m^2 projected, weighed ~2 t (0.016 t/m^2, weak source), the kite alone under 1 t (EMSA 2023); 0.05 covers a heavier holding winch and mast."
kite_lifetime:
