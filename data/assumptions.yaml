  reason: "Cost of a soft kite's fabric with its reinforcements, 45, and its bridle lines, 8, per m^2 of flat area, for systems of 100 kW-2 MW in a series of 50 or more, without overhead or margin, from a survey of ten makers, suppliers and universities in 2023 [@joshi2024refeconomic, pp.2 and 7]; 25/18 flat m^2 per projected m^2 as there. The survey gives no spread, no money year, no cloth weight and no cell layout, and does not say whether sewing is in the fabric's 45."
canopy_structure_chord:
