teu_tare_mass:
  value: 1.85
  low: 1.85
  high: 2.3
  unit: t
  reason: "Tare per TEU of the 40 ft dry container, 3.7 t, that carries most TEU; a 20 ft box weighs 2.3 t (Hapag-Lloyd container specification; Eurostat maritime manual 3.5.4). Eurostat's goods weight, on which cargo_per_teu rests, excludes it (manual 3.4.1)."
empty_container_share:
  value: 0.188
  low: 0.16
  high: 0.188
  unit: "-"
  reason: "Empty TEU over all TEU handled in EU27 main ports: 18.8 % in 2024, 16.0-18.8 % over 2010-2024 (Eurostat mar_mg_am_cvh, loading status EMPTY and TOTAL). An empty box takes a slot and its tare but carries no cargo."
teu_volume:
  value: 38.3
  low: 33.2
  high: 38.3
  unit: m^3
  reason: "Space of one TEU slot taken by a fuel tank: the external 20 ft box of ISO 668, 6.058 x 2.438 x 2.591 m, as ICCT counts it (Mao et al. 2020); the low bound is the internal volume (Hapag-Lloyd)."
cargo_per_ceu:
  value: 1.3
  low: 1.15
  high: 1.6
  unit: t
  reason: "Cargo per CEU of car-deck space: a PCTC hull of 8,600 CEU is optimised for 8,000-15,000 t of payload (Knud E. Hansen 8,600 CEU DF PCTC), 1.3 t at its design deadweight; new EU cars weigh 1.56 t in running order (ICCT 2025, EEA data) and take about 1.33 CEU, 1.17 t/CEU; the 6,500 CEU Future Way's design deadweight gives ~1.6."
ceu_volume:
  value: 24.0
  low: 17.0
  high: 30.0
  unit: m^3
  reason: "Car-deck space per CEU that a fuel tank displaces: 8.4 m^2 of deck per CEU (Hoegh Target 71,400 m^2 for 8,500 CEU; Knud E. Hansen 8,600 and 6,500 CEU designs 8.41-8.45) times a deck pitch of 2.9 m (depth over car decks of the same designs); the low bound is the 2.0 m clear height, the high bound the enclosed volume per CEU from gross tonnage."

# --- hydrogen drive ---
hydrogen_price:
  value: 6.5
  low: 3.3
  high: 10.8
  unit: USD/kg
  reason: "Liquid green hydrogen bunkered around 2030, 54 (28-90) USD/GJ at 120 MJ/kg: production 4 (2-7) USD/kg in good export regions (IEA Global Hydrogen Review 2025, pp. 94-97; 2024, p. 83), liquefaction 2.0 (1.0-2.8) USD/kg (DOE record 19001: 2.75 at 27 t/d today; IRENA 2022 Table 6.3 for 2030, levelised at 8 %), terminal and bunkering 0.5 (0.3-1.0) USD/kg (DOE 19001: terminal 0.39)."
hydrogen_heating_value:
  value: 120.0
  low: 120.0
  high: 120.0
  unit: MJ/kg
  reason: "Lower heating value of hydrogen."
fuel_cell_system_cost:
  value: 1080.0
  low: 995.0
  high: 1620.0
  unit: USD/kW
  reason: "Marine PEM system with balance of plant and DC/DC converter in 2030: Clean Hydrogen JU SRIA target 1,000 EUR/kW (Annex 4, Table 17); EMSA 2023 920 EUR/kW (Table 75), the low bound; the high bound is the SRIA 2024 target of 1,500 EUR/kW, at 1.08 USD/EUR."
electric_drive_cost:
  value: 485.0
  low: 220.0
  high: 600.0
  unit: USD/kW
  reason: "Motor, converter and switchboard of an electric drive without its gensets: electric_propulsion_cost less a methanol genset of 265 + 120 EUR/kW (Kanchiralla et al. 2022); the low bound is motor and gearbox alone, 200 EUR/kW (EMSA 2023, Table 76). No source prices converters separately."
fuel_cell_efficiency:
  value: 0.48
  low: 0.45
  high: 0.56
  unit: "-"
  reason: "LHV efficiency of a PEM system at rated power net of balance of plant: PowerCell Marine System 200 uses 13 kg/h at 200 kW (46 %), the DOE heavy-duty model 56 % new and 50 % at end of life (record 24004); studies use a constant 54-55 % (Mao et al. 2020; EMSA 2023), close to the datasheet peaks of 53-60 %."
fuel_cell_part_load_penalty:
  value: -0.35
  low: -0.53
  high: -0.27
  unit: "-"
  reason: "Negative: PEM efficiency rises at part load, to the 60 % peak near a quarter load of the PowerCell MS200 (fit -0.53) and 64.5 % of the DOE model (-0.27); the quadratic misses the drop below ~25 % load, where Ballard's FCwave stops (55 of 200 kW)."
fuel_cell_string_count:
  value: 16
  low: 8
  high: 32
  unit: "-"
  reason: "Independently switched fuel-cell units: PowerCell's 6 MW concept has two blocks of sixteen 200 kW modules on a DC bus, each with its own converter (Marine System 200 datasheet)."
fuel_cell_min_load:
  value: 0.275
  low: 0.2
  high: 0.3
  unit: "-"
  reason: "Lowest load of a running fuel-cell unit, below which its balance of plant makes efficiency fall: the Ballard FCwave's minimum power is 55 of 200 kW (2021 specification); the efficiency curve peaks near a quarter load (PowerCell MS200, DOE record 24004)."
fuel_cell_chain_efficiency:
  value: 0.92
  low: 0.90
  high: 0.94
  unit: "-"
  reason: "Fuel cell to shaft: motor, gearbox and control at 0.98 each (Kanchiralla et al. 2022, 2023) gives 0.94; the diesel-electric chain without its 0.97 alternator gives 0.93, less a DC/DC converter per module."
fuel_cell_stack_life:
  value: 25000.0
  low: 15000.0
  high: 40000.0
  unit: h
  reason: "Operating hours at rated power before stack replacement: DOE heavy-duty design life 25,000 h (record 26002); Ballard FCwave >15,000 h (2024 datasheet); the SRIA 2024 maritime target 40,000 h includes stack swaps."
fuel_cell_stack_share:
  value: 0.6
  low: 0.5
  high: 1.0
  unit: "-"
  reason: "Stack replacement over fuel-cell system price: the stack is 60-63 % of system cost (DOE records 24004, 26002); EMSA 2023 and Kanchiralla et al. replace the whole system, the high bound."
lh2_tank_cost:
  value: 55.0
  low: 25.0
  high: 100.0
  unit: USD/kg
  reason: "Vacuum-insulated type C LH2 tank with fuel supply system per kg of hydrogen held: 50,310 EUR per tonne (EMSA 2023, Table 17, from Korberg et al. 2021); stationary tanks 15-45 USD/kg, a spherical one ~100 (IRENA 2022, p. 74)."
lh2_tank_gravimetric_density:
  value: 0.10
  low: 0.07
  high: 0.15
  unit: "-"
  reason: "Hydrogen over the mass of the filled tank system: ~9 kg of steel per kg H2 for LH2 storage (IRENA 2022, p. 76, from Sandia); no ship-tank datum found, bounds by judgement."
lh2_tank_volumetric_density:
  value: 38.0
  low: 33.0
  high: 42.0
  unit: kg/m^3
  reason: "Hydrogen per m^3 of hold space taken by the insulated tank and fuel system: 40 (Mao et al. 2020, from Minnehan & Pratt 2017), 4.6 MJ/L contained (EMSA 2023, Table 16); a sphere in a cubic space 33, the MF Hydra's 4 t tank of 10 x 3.5 m 42 (Norled 2021). Boil-off of 0.05-0.25 %/day (IRENA 2022, p. 23; IEA 2024, p. 221) feeds the fuel cells and costs nothing at sea."
