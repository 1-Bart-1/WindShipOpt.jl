  unit: kg/kN
  source: "@paulig2013: the steering pod of a 320 kN SkySails kite"
  reason: "Mass of the airborne steering pod per kN of tether force limit: 70 kg for a 320 kN kite, steering forces up to 12 kN [@paulig2013], the one figure for a ship kite; its link and actuators carry loads in proportion to the force. Powered through the tether at 120 V, with a battery for emergencies [@maass2013]."
kite_aspect_ratio:
  value: 3.0
  unit: "-"
  estimate: true
  source: "Authors' estimate, above the SkySails kites [@paulig2013]"
  reason: "Projected span squared over projected area. The base 3 is the authors' estimate. SkySails gave its ship kite a projected aspect ratio below 2 for tolerance to angle of attack and stability at launch and landing [@paulig2013], and a SkySails Power wing has 1.86 [@folkersma2020]; 2.5 is the lowest with a polar."
kite_flight_drag:
  value: 0.085
  low: 0.0
  high: 0.12
  unit: "-"
  source: "Fitted to the glide ratio kites fly [@vandervlugt2019; @erhard2013b]"
  reason: "Drag on the projected area that the design-shape model lacks in flight: bridle, deformation, control unit and steering. The V3 wing reaches L/D 8-8.5 in the wind tunnel [@poland2025] but 3.6-4.0 in traction with bridle and control unit, tether excluded [@vandervlugt2019]; a 160 m^2 SkySails kite flew 3.9 with tether, which its makers call low since the wind was measured far below it, and they give 4-5 [@erhard2013b]; 0.085 brings the aspect-ratio-3 kite to 4.1 at CL 0.8 without tether and 3.9 with it; 0 is a kite that keeps its design shape in flight."
kite_landing_max_wind:
  value: 20.0
  unit: m/s
  source: "@skypower100_tib: stowage design of the SkySails land kite"
  reason: "Highest apparent wind for a landing that is not forced: the stowage of a full-size land kite was designed for up to 20 m/s [@skypower100_tib], which also calls landing more time-critical than launch."
kite_launch_sea_wind:
  value: 5.0
  unit: m/s
  source: "@paulig2013: SkySails launch wind in rough against calm sea"
  reason: "Extra apparent wind a launch needs in a rough sea, significant wave height from 2.5 m (sea state 5 of the World Meteorological Organization), against the calm-sea value. SkySails ships: about 5 m/s in perfect conditions, while rough sea and bad weather might require 10 m/s [@paulig2013]; the value takes the whole 5 m/s step for the sea, though bad weather is part of it."
kite_launch_min_wind:
  value: 5.0
  low: 3.0
  high: 5.4
  unit: m/s
  source: "@paulig2013: SkySails ship launches in perfect conditions"
  reason: "Lowest apparent wind for a launch in a calm sea, where it exceeds the lowest wind the kite flies in, which the kite's mass sets; a rough sea adds the sea launch wind. It holds the kite's lift-off from the mast with its margin for gusts, tether sag, control and the climb. SkySails ships: about 5 m/s in perfect conditions [@paulig2013]; not below Beaufort 3, 3.4-5.4 m/s [@noaa2009]. SkySails on land: launched from 3 m/s average wind [@fagiano2022autonomous, sec. 2.1.1], and 5 m/s measured against an assumed 6 [@skypower100_tib]. Kitepower Falcon: 5 m/s [@kitepower2024]. The range runs from 3 to 5.4 m/s."
kite_launch_max_wind:
  value: 17.0
  unit: m/s
  estimate: true
  source: "Authors' estimate: one Beaufort step below the flight limit"
  reason: "Authors' estimate: highest apparent wind for a launch, the top of Beaufort 7, one step below the Beaufort 8 flight limit of SkySails ship kites. SkySails on land reports landing as more time-critical than launch and reliable under nominal wind [@skypower100_tib]. The VTOL kite hovers in launch and landing up to the same wind; the one offshore flight hovered in 10 m/s [@echeverri2020part1, Part I, p.392]."
kite_cycle_crew_cost:
  value: 85.0
  unit: USD
  estimate: true
  source: "Authors' estimate: three crew for 1.5 h [@ilo2025wagescale]"
  reason: "Authors' estimate of crew time per launch and landing; SkySails meant one operator to run the system [@maass2013]. Low officer and rating for 0.5 h; base officer and two ratings for 1.5 h; high officer and three ratings for 3 h at EU rates. Rates 29 and 14 USD/h per hour worked, from the crew cost here over about 3,650 worked hours per berth a year (authors' estimate, 10 h a day), split by rank with the ITF scale for 2025 [@ilo2025wagescale]."
kite_cycle_canopy_hours:
  value: 3.3
  unit: flight hours
  estimate: true
  source: "@northsails_durability: flogging wear, for 2 min per launch"
  reason: "Canopy life used up by its flogging at one launch and landing: leaving a sail flogging for 30 minutes can equal 50 hours of normal sailing [@northsails_durability], applied to 2 minutes of flogging per launch and landing (1-5), the authors' estimate. The flogging a sail sees at hoisting and in tacks is already in the canopy life."
kite_launch_loss_probability:
  value: 0.0001
  low: 0.0001
  high: 0.0025
  unit: "-"
  today: 0.0025
  source: "Development goal; @usaf2022mq9: recent loss rate of the MQ-9"
  reason: "Goal: kites lost per launch and landing, with canopy, tether and control unit, whether torn, in the water or crashed in flight; a loss costs what crash_cost gives. The mature uncrewed MQ-9 lost 43 aircraft in 2.67 million flight hours, 1.13 per 100,000 h over its last five years [@usaf2022mq9], at 12.7 h a sortie (one million hours in 78,606 sorties [@airforcemag2015predatorb]) one in 5,000 sorties, one in 7,000 lately. The goal takes the MQ-9's recent rate, a kite landing before its limits. The high bound is today: no ship kite has published a loss count, SkySails' more than 1,200 automated flights [@skysails2018] would show at most one in 400 with no loss at 95 % confidence, and the M600 lost all four of its crosswind kites in about twenty flights [@echeverri2020part1, Part I, pp.248, 355]."
