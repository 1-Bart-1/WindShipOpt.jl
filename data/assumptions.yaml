  value: 830.0
  low: 615.0
  high: 1130.0
  unit: kg/m^3
  source: "@bosman2013 [Table 33.4]: coated 12-strand rope at nominal diameter"
  reason: "Rope mass over its nominal cross-section: 60.8 kg per 100 m at 30.6 mm, 827 kg/m^3, coated 12-strand [@bosman2013, Table 33.4]. Their worked-in diameter, 26.0 mm, would give 1,145 kg/m^3, above solid HMPE at 970 kg/m^3, so it cannot be the section that meets the wind. Low: 4.83 kg per 100 m at 10 mm, 615 kg/m^3, of coated Marlow D12 78 [@marlow_d12_78]. High: the SkySails tether with its power and data cable, 0.9 kg/m for 320 kN [@paulig2013]."
tether_bend_life:
  value: 1000000.0
  low: 450000.0
  high: 2900000.0
  unit: bends
  source: "@bosman2013; @davies2015: bending tests of HMPE rope"
  reason: "Single bends over the winch drum or a sheave that end a ship kite's tether while it is reeled out at launch and in at landing, at about 3 % of break load, a tenth of the force limit at design factor 3, and a drum of 30 rope diameters. High: 2.9 million, the coated 20 mm 12-strand rope [@bosman2013, Fig. 33.17 and p.574], 450,000 bends at 10 % of break load and drum ratio 30 carried along its slope of 2.7 to 3.3 % and divided by 3 for the 20 mm rope against the 8 mm one tested. Low: 450,000, the 19 mm rope [@davies2015, Eq. 1], 211 f^-2.25 bends at f = 3.3 % of its break load over 20 diameters. The base is near their geometric mean. Both laws are fitted at 10 % of break load and above, so this is an extrapolation; the life barely changes from 18 to 24 mm [@davies2018], and no test reaches the 71 mm of the 3,200 m^2 kite."
tether_bends_per_launch:
  value: 8.0
  low: 4.0
  high: 10.0
  unit: "-"
  source: "@skysails_patent_US11578697: drum, two rollers and tow point disk"
  reason: "Bends of each section of the tether in one launch and landing, one per pass over a sheave or on or off the drum [@bosman2013; @davies2015]: off the drum and over two deflection rollers and the tow point disk going out [@skysails_patent_US11578697], back over all four coming in. Low: the drum and the disk alone; high: one further guiding sheave."
tether_lifetime:
  value: 16000.0
  low: 4700.0
  high: 45000.0
  unit: flight hours
  source: "Creep laws of @humeau2018 and @bosman2013 over the routed trips"
  reason: "Flight hours of a 12-strand SK78 tether flown at a fixed length, set by creep and its load peaks [@bosman2013; @humeau2018]. Creep damage summed by Miner's rule over the hours flown at each tension on the routed trips of the 140 m, Kamsarmax and Neo-Panamax ships at 25 °C: 10,000-12,100 h with the power law of @humeau2018 (exponent 4.43, 112 kJ/mol) anchored at 8 years at 20 % of break load and 20 °C [@dsm_sk78_mooring], 22,700-26,100 h with the time-tension-temperature diagram of @bosman2013; the base is their geometric mean, 15,100-17,800 h. Low: the power law at 30 °C with the harshest loads, 4,700-5,500 h; high: the diagram at 20 °C, 39,000-45,000 h. The swing of each figure eight, gusts and the ship's motion in a seaway shorten the creep life by 0-9 % against a steady load at its mean. Bending over the drum and sheaves at launch and landing is charged per launch from the tether bend life. Bending on the tow point disk [@skysails_patent_US11578697] wears only the 0.54 m of rope that rolls on and off it as the kite swings in elevation, in about 180 h on the 71 mm tether of the 3,200 m^2 kite; reeling in that much every 90 to 180 flight hours, at every one to five launches, moves fresh rope there and uses 50 to 100 m of spare rope over this life, 4 to 8 % of the tether, which is left out. Nearest service record: HMPE ship mooring lines, designed for 8,000 mooring hours to 75 % strength at up to 22 % of break load and retired by wear [@wilhelmsen2022]."
