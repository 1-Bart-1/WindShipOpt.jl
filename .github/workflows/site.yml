name: Site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - paper/sections/numbers.tex
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.release.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - name: Find the release of the run the paper's results name
        id: release
        run: |
          run=$(python3 -I scripts/paper_run.py)
          read -r commit fidelity <<< "$run"
          url="https://github.com/${{ github.repository }}/releases/download/run-$commit/$fidelity.tar.gz"
          status=$(curl -sSIL -o /dev/null -w '%{http_code}' "$url")
          if [ "$status" = 404 ]; then
            echo "::notice::Site not deployed: the $fidelity run at $commit has no release yet."
            echo "The site was not deployed: the $fidelity run at commit $commit," \
              "which the paper's results name, has no release yet (\`bin/runs push\`)." \
              >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" = 200 ]; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$url answered HTTP $status"
            exit 1
          fi

  build:
    needs: run
    if: needs.run.outputs.url
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the run the paper's results name
        run: |
          curl -fsSL "${{ needs.run.outputs.url }}" | tar -xz -C "$RUNNER_TEMP" runs
          echo "RUN_DIRECTORY=$(echo "$RUNNER_TEMP"/runs/*)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
